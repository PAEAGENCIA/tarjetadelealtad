      <p class="small" style="font-weight:700;color:var(--ink-2)">Cambiar tu PIN de dueño</p>
      <p class="muted small" style="margin:2px 0 10px">Al cambiarlo, todos los celulares que tenían tu sesión abierta se salen solos.</p>
      <div class="row" style="gap:8px">
        <input class="input code ph-plain" type="password" inputmode="numeric" maxlength="8" placeholder="PIN nuevo" aria-label="PIN nuevo" value="${escapeHtml(secForm.newPin)}" oninput="secForm.newPin=this.value.replace(/\\D/g,'').slice(0,8);this.value=secForm.newPin">
        <input class="input code ph-plain" type="password" inputmode="numeric" maxlength="8" placeholder="Repítelo" aria-label="Repite el PIN nuevo" value="${escapeHtml(secForm.newPin2)}" oninput="secForm.newPin2=this.value.replace(/\\D/g,'').slice(0,8);this.value=secForm.newPin2">
      </div>
      <button class="btn btn-secondary btn-block mt-12" ${busy?'disabled':''} onclick="changeOwnerPin()">Cambiar mi PIN</button>

      <div class="sec-split"></div>
      <p class="small" style="font-weight:700;color:var(--ink-2)">PIN del personal <span class="status-dot ${cache.biz.hasStaffPin?'on':''}">${cache.biz.hasStaffPin?'Activo':'Sin crear'}</span></p>
      <p class="muted small" style="margin:2px 0 10px">Tu equipo entra con este PIN y solo puede escanear, dar sellos, canjear premios y aprobar o rechazar solicitudes. No ve correos, no descarga tu base y no cambia tus ajustes.</p>
      <input class="input code ph-plain" type="password" inputmode="numeric" maxlength="8" placeholder="${cache.biz.hasStaffPin?'Nuevo PIN del personal':'PIN del personal'}" aria-label="PIN del personal" value="${escapeHtml(secForm.staffPin)}" oninput="secForm.staffPin=this.value.replace(/\\D/g,'').slice(0,8);this.value=secForm.staffPin">
      <div class="row mt-12" style="gap:8px">
        <button class="btn btn-secondary" style="flex:1" ${busy?'disabled':''} onclick="saveStaffPin(false)">${cache.biz.hasStaffPin?'Cambiar PIN':'Crear PIN del personal'}</button>
        ${cache.biz.hasStaffPin?`<button class="btn btn-ghost" ${busy?'disabled':''} onclick="saveStaffPin(true)">Quitar</button>`:''}
      </div>
      <p class="hint">Si alguien de tu equipo deja de trabajar contigo, cambia este PIN y su celular pierde el acceso.</p>
      ${errorHtml(secError)}
    </div>
    <div class="card">
      <div class="card-title">${ic('download',18)} Tu base de clientes</div>
      <p class="muted small">Nombre, teléfono, correo, favoritos y si aceptan promociones. Se abre en Excel o Google Sheets. Envía promociones solo a quienes las aceptaron.</p>
      <button class="btn btn-secondary btn-block mt-12" ${busy?'disabled':''} onclick="downloadCustomers()">${ic('download',18)} Descargar clientes</button>
    </div>
  `;
}

function viewClienteBuscar(){
  return `
  <div class="wrap fade">
    ${backHtml('goHome()')}
    <h2 class="mt-12">Ver mi tarjeta</h2>
    <p class="lead">Pide el código en el mostrador del negocio.</p>
    <div class="card mt-24">
      <div class="field"><label for="s-slug">Código del negocio</label><div class="input-icon">${ic('store',18)}<input id="s-slug" class="input" type="text" autocapitalize="none" value="${escapeHtml(clienteLookup.slug)}" placeholder="cafe-luna" oninput="clienteLookup.slug=this.value"></div></div>
      <div class="field"><label for="s-phone">Tu teléfono</label><div class="input-icon">${ic('phone',18)}<input id="s-phone" class="input" type="tel" inputmode="tel" value="${escapeHtml(clienteLookup.phone)}" placeholder="222 123 4567" oninput="clienteLookup.phone=this.value"></div></div>
    </div>
    <button class="btn btn-primary btn-block mt-24" ${busy?'disabled':''} onclick="buscarTarjetaCliente()">${busy?'Buscando…':'Ver mi tarjeta'}</button>
  </div>`;
}

function viewClienteTarjeta(){
  const {status, biz, customer} = clienteResult;
  let body;
  if(status==='no_biz'){
    body = `<div class="card mt-24"><div class="empty"><div class="empty-ico">${ic('store',26)}</div><b style="color:var(--ink)">No encontramos ese negocio</b><p class="small mt-8">Revisa el código con el personal del negocio.</p></div></div>`;
  }else if(status==='no_card'){
    body = `
      <h2 class="mt-12">Pide tu tarjeta</h2>
      <p class="lead">Aún no tienes tarjeta en ${escapeHtml(biz.name)}. Pídela aquí y el personal la aprueba en tu visita.</p>
      ${biz.promos && biz.promos.welcome ? `<div class="promo-banner mt-16">${ic('gift',20)}<span><b>Regístrate y llévate tu primer sello de regalo.</b></span></div>` : ''}
      ${promoBannerHtml(biz)}
      <div class="mt-24">${passHtml(biz, null, {})}</div>
      <div class="card mt-24">
        <div class="field"><label>Tu teléfono</label><div class="input-icon">${ic('phone',18)}<input class="input" type="tel" value="${escapeHtml(normalizePhone(clienteLookup.phone))}" disabled></div></div>
        <div class="field"><label for="r-name">Tu nombre</label><input id="r-name" class="input" type="text" autocomplete="name" value="${escapeHtml(requestForm.name)}" placeholder="Para que te reconozcan en caja" oninput="requestForm.name=this.value"></div>
        <div class="field"><label for="r-email">Tu correo</label><input id="r-email" class="input" type="email" inputmode="email" autocomplete="email" autocapitalize="none" value="${escapeHtml(requestForm.email)}" placeholder="tucorreo@ejemplo.com" oninput="requestForm.email=this.value"><p class="hint">Para avisarte cuando tu premio esté listo.</p></div>
        ${biz.promos && biz.promos.referral ? `<div class="field"><label for="r-ref">¿Quién te invitó? <span class="muted">(opcional)</span></label><div class="input-icon">${ic('phone',18)}<input id="r-ref" class="input" type="tel" inputmode="tel" value="${escapeHtml(requestForm.ref||'')}" placeholder="Teléfono de tu amigo" oninput="requestForm.ref=this.value"></div><p class="hint">Tu amigo gana un sello cuando hagas tu primera compra.</p></div>` : ''}
        <div class="field"><label>Tu cumpleaños</label>${bdayPickerHtml('requestForm.bday','r-bday')}<p class="hint">Con tu teléfono y tu cumpleaños abres tu tarjeta desde cualquier celular.</p></div>
        ${biz.plan==='premium' ? `<div class="field">
          <label>¿Qué es lo que más te gusta de ${escapeHtml(biz.name)}? <span class="muted">(opcional)</span></label>
          ${(biz.products||[]).length ? `<div class="chips">${biz.products.map(p=>`<button type="button" class="pick ${requestForm.favorites.includes(p)?'on':''}" onclick="toggleFavorite('${jsEsc(p)}')">${requestForm.favorites.includes(p)?ic('check',14):''}${escapeHtml(p)}</button>`).join('')}</div><p class="hint">Elige hasta 5.</p>`
            : `<input id="r-fav" class="input" type="text" value="${escapeHtml(requestForm.favText)}" placeholder="Tu producto favorito" oninput="requestForm.favText=this.value">`}
        </div>` : ''}
      </div>
      <div class="card mt-12" style="padding-top:6px;padding-bottom:6px">
        <label class="check"><input type="checkbox" ${requestForm.marketing?'checked':''} onchange="requestForm.marketing=this.checked"><span>Quiero recibir promociones y novedades de ${escapeHtml(biz.name)}.</span></label>
        <label class="check"><input type="checkbox" ${requestForm.privacy?'checked':''} onchange="requestForm.privacy=this.checked"><span>Acepto el <button type="button" class="linkbtn" onclick="event.preventDefault();showPrivacy=!showPrivacy;render()">aviso de privacidad</button>.</span></label>
        ${showPrivacy ? privacyHtml(biz) : ''}
      </div>
      ${errorHtml(requestError)}
      <button class="btn btn-primary btn-block mt-24" ${busy?'disabled':''} onclick="solicitarTarjeta()">${busy?'Enviando…':ic('card')+' Solicitar mi tarjeta'}</button>`;
  }else if(status==='locked'){
    const nombre = customer.firstName || '';
    const pend = customer.status==='pending';
    body = `
      <div class="success-ico mt-12" style="background:var(--brand-soft);color:var(--brand)">${ic('lock',30)}</div>
      <h2>Hola${nombre?', '+escapeHtml(nombre):''}</h2>
      <p class="lead">${pend ? `Tu solicitud en ${escapeHtml(biz.name)} ya está enviada.` : `Tu tarjeta de ${escapeHtml(biz.name)} ya existe.`} Para cuidar tu privacidad, confirma que eres tú.</p>
      ${unlockNoBday ? `
      <div class="card mt-24"><p style="font-weight:700">Tu tarjeta aún no tiene cumpleaños registrado.</p><p class="muted small mt-8">Pide en caja que lo agreguen o que te envíen tu tarjeta por WhatsApp.</p></div>` : `
      <div class="card mt-24">
        <div class="field" style="margin-bottom:0"><label>¿Cuándo es tu cumpleaños?</label>${bdayPickerHtml('unlockForm','u-bday')}</div>
        ${errorHtml(unlockError)}
      </div>
      <button class="btn btn-primary btn-block mt-16" ${busy?'disabled':''} onclick="unlockCard()">${busy?'Abriendo…':ic('card')+' Abrir mi tarjeta'}</button>`}
      <div class="card mt-24">
        <div class="card-title">${ic('info',18)} ¿Necesitas ayuda?</div>
        <p class="muted small">Muestra este código en caja y el personal te ${pend?'aprueba':'pone tu sello'} o te envía tu tarjeta por WhatsApp.</p>
        <div class="qr-help">${qrSvg(biz.slug+':'+customer.phone)}</div>
        <p class="muted small" style="text-align:center">${escapeHtml(customer.phone)}</p>
      </div>`;
  }else if(status==='pending'){
    body = `
      <div class="success-ico mt-12" style="background:var(--brand-soft);color:var(--brand)">${ic('clock',30)}</div>
      <h2>Solicitud enviada</h2>
      <p class="lead">${customer.name?escapeHtml(customer.name)+', t':'T'}u tarjeta de ${escapeHtml(biz.name)} está esperando aprobación. Dile tu nombre al personal en tu visita.</p>
      <div class="mt-24" style="opacity:.55">${passHtml(biz, null, {})}</div>
      <button class="btn btn-secondary btn-block mt-24" ${busy?'disabled':''} onclick="buscarTarjetaCliente()">${busy?'Revisando…':ic('refresh')+' Ya me aprobaron, ver mi tarjeta'}</button>`;
  }else{
    const goal = goalOf(biz);
    const left = Math.max(0, goal - customer.progress);
    body = `
      <h2 class="mt-12">Hola${customer.name?', '+escapeHtml(customer.name):''}</h2>
      <p class="lead">${left===0 ? '¡Ya tienes tu premio! Muéstrale esta tarjeta al personal.' : `Te ${left===1?'falta':'faltan'} ${left} ${biz.mechanic==='sellos'?(left===1?'sello':'sellos'):(left===1?'punto':'puntos')} para tu premio.`}</p>
      ${promoBannerHtml(biz, customer.promoForYou)}
      <div class="mt-24">${passHtml(biz, customer, {qr:true})}</div>
      <div class="wallet-btns">
        <button class="wallet-btn" onclick="addToWallet('apple')">${ic('wallet',18)} Apple Wallet</button>
        <button class="wallet-btn" onclick="addToWallet('google')">${ic('wallet',18)} Google Wallet</button>
      </div>
      ${biz.promos && (biz.promos.rules.length || biz.promos.referral) ? `<div class="card mt-16">
        <div class="card-title">${ic('gift',18)} Promociones de ${escapeHtml(biz.name)}</div>
        ${biz.promos.rules.length ? `<ul class="promo-rules">${biz.promos.rules.map(r=>`<li>${escapeHtml(r)}</li>`).join('')}</ul>` : ''}
        ${biz.promos.referral ? `<button class="btn btn-secondary btn-block mt-12" onclick="inviteFriend()">${ic('share',18)} Invitar a un amigo</button>` : ''}
      </div>` : ''}
      ${customer.hasBirthday===false ? `<div class="card mt-16">
        <div class="card-title">${ic('gift',18)} Agrega tu cumpleaños</div>
        <p class="muted small" style="margin-bottom:10px">Así abres tu tarjeta desde cualquier celular solo con tu teléfono y tu cumpleaños.</p>
        ${bdayPickerHtml('myBday','my-bday')}
        <button class="btn btn-secondary btn-block mt-12" ${busy?'disabled':''} onclick="saveMyBirthday()">Guardar mi cumpleaños</button>
      </div>` : ''}
      <div class="private-note mt-16">${ic('lock',16)}<span>Solo tú y ${escapeHtml(biz.name)} pueden ver tus sellos. Si cambias de celular, ábrela con tu teléfono y tu cumpleaños.</span></div>`;
  }
  return `
  <div class="wrap fade">
    <button class="back" onclick="view='clienteBuscar';render()">${ic('left',18)} Buscar otra tarjeta</button>
    ${body}
  </div>`;
}

function viewCargando(){
  return `<div class="wrap fade"><div class="topbar">${logoHtml()}</div><div class="empty"><p class="muted">Cargando…</p></div></div>`;
}

/* ---------- Render principal ---------- */
function render(){
  let html;
  switch(view){
    case 'negocioAuth': html = viewNegocioAuth(); break;
    case 'negocioCrear': html = viewNegocioCrear(); break;
    case 'negocioExito': html = viewNegocioExito(); break;
    case 'negocioEntrar': html = viewNegocioEntrar(); break;
    case 'dashboard': html = viewDashboard(); break;
    case 'clienteBuscar': html = viewClienteBuscar(); break;
    case 'clienteTarjeta': html = viewClienteTarjeta(); break;
    case 'cargando': html = viewCargando(); break;
    case 'adminPae': html = viewAdminPae(); break;
    default: html = viewHome();
  }
  document.getElementById('app').innerHTML = `<div class="app-shell">${html}</div>${view==='dashboard'?scanSheetHtml():''}${toastHtml()}`;
  hydrateQR();
}
view = 'cargando';
render();
boot().then(()=>{ if(view==='cargando'){ view='home'; render(); } });
</script>
</body>
</html>
