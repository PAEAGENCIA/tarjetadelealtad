<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vuelve — Tarjetas de lealtad digitales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F2ED; --surface:#FFFFFF; --surface-2:#FBF9F6;
  --ink:#1A1320; --ink-2:#4A4150; --muted:#8A8190; --line:#EAE3DC;
  --brand:#E62E6B; --brand-deep:#B3174D; --brand-soft:#FDE7EF;
  --accent:#FFB627; --ok:#1E8E5A; --danger:#D23A2A;
  --r-sm:10px; --r:14px; --r-lg:20px;
  --shadow:0 1px 2px rgba(26,19,32,.05), 0 8px 24px -12px rgba(26,19,32,.14);
  --shadow-lg:0 2px 4px rgba(26,19,32,.04), 0 24px 48px -20px rgba(26,19,32,.28);
  --display:'Fraunces', Georgia, serif;
  --sans:'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}
.app-shell{min-height:100vh;padding:max(20px, env(safe-area-inset-top)) 18px calc(80px + env(safe-area-inset-bottom));}
.wrap{max-width:460px;margin:0 auto;}
.fade{animation:fade .28s ease both;}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}

h1,h2,h3{margin:0;color:var(--ink);}
h1{font-family:var(--display);font-weight:700;font-size:2.15rem;line-height:1.08;letter-spacing:-.02em;}
h2{font-family:var(--display);font-weight:700;font-size:1.6rem;line-height:1.15;letter-spacing:-.01em;}
h3{font-size:1rem;font-weight:700;}
p{margin:0;}
.lead{color:var(--ink-2);font-size:1rem;margin-top:10px;}
.muted{color:var(--muted);}
.small{font-size:.84rem;}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}.mt-24{margin-top:24px}.mt-32{margin-top:32px}
:focus-visible{outline:3px solid color-mix(in srgb, var(--brand) 45%, transparent);outline-offset:2px;border-radius:8px;}

.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;min-height:40px;}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-style:italic;font-size:1.45rem;color:var(--ink);}
.logo-mark{width:34px;height:34px;border-radius:11px;background:var(--brand);color:#fff;display:grid;place-items:center;font-style:normal;font-size:1.05rem;transform:rotate(-6deg);box-shadow:0 6px 14px -6px var(--brand);}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);display:grid;place-items:center;cursor:pointer;}
.icon-btn:active{transform:scale(.96);}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);font-weight:600;font-size:.92rem;cursor:pointer;background:none;border:none;padding:8px 0;font-family:var(--sans);}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 20px;border-radius:var(--r);border:none;font-family:var(--sans);font-size:.98rem;font-weight:700;cursor:pointer;transition:transform .12s ease, box-shadow .2s ease, background .2s ease;white-space:nowrap;}
.btn:active{transform:scale(.98);}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}
.btn-primary{background:var(--brand);color:#fff;box-shadow:0 10px 22px -12px var(--brand), inset 0 1px 0 rgba(255,255,255,.18);}
.btn-primary:hover:not(:disabled){background:var(--brand-deep);}
.btn-secondary{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow);}
.btn-dark{background:var(--ink);color:#fff;}
.btn-gold{background:var(--accent);color:#3A2600;box-shadow:0 10px 22px -12px var(--accent);}
.btn-ghost{background:transparent;color:var(--ink-2);height:44px;}
.btn-block{width:100%;}
.btn-sm{height:42px;font-size:.9rem;padding:0 14px;border-radius:12px;}
.row{display:flex;gap:10px;align-items:center;}
.stack{display:flex;flex-direction:column;gap:12px;}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow);}
.card + .card{margin-top:12px;}
.card-title{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:14px;color:var(--ink);}
.card-title svg{color:var(--brand);}

.field + .field{margin-top:16px;}
label{display:block;font-size:.82rem;font-weight:700;color:var(--ink-2);margin-bottom:8px;}
.input{width:100%;height:50px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);font-family:var(--sans);font-size:1rem;transition:border-color .15s, background .15s, box-shadow .15s;}
.input:focus{outline:none;border-color:var(--brand);background:#fff;box-shadow:0 0 0 4px var(--brand-soft);}
.input.code{font-family:ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.3em;font-size:1.1rem;}
.input-icon{position:relative;}
.input-icon svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;}
.input-icon .input{padding-left:42px;}
.hint{font-size:.8rem;color:var(--muted);margin-top:7px;}
.error{display:flex;gap:8px;align-items:center;background:#FDECEA;color:var(--danger);font-weight:600;font-size:.88rem;padding:11px 14px;border-radius:12px;margin-top:16px;}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface-2);border:1px solid var(--line);padding:5px;border-radius:14px;}
.seg button{border:none;background:transparent;height:46px;border-radius:10px;font-family:var(--sans);font-weight:700;font-size:.92rem;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);}
.seg button.on svg{color:var(--brand);}

.swatches{display:flex;gap:10px;flex-wrap:wrap;}
.swatch{width:36px;height:36px;border-radius:50%;border:none;cursor:pointer;position:relative;display:grid;place-items:center;color:#fff;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);}
.swatch.on{box-shadow:0 0 0 3px var(--surface), 0 0 0 5px var(--ink);}

.choice{display:flex;align-items:center;gap:14px;padding:18px;cursor:pointer;text-align:left;width:100%;font-family:var(--sans);}
.choice:active{transform:scale(.99);}
.choice-icon{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex-shrink:0;}
.choice-body{flex:1;}
.choice-title{font-weight:700;font-size:1rem;color:var(--ink);}
.choice-desc{font-size:.86rem;color:var(--muted);margin-top:2px;}
.choice > svg:last-child{color:var(--muted);}

.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:.8rem;font-weight:600;color:var(--ink-2);}
.chip svg{color:var(--brand);}

/* ---------- Tarjeta tipo Wallet ---------- */
.pass{position:relative;border-radius:22px;padding:20px 20px 18px;color:var(--on);background:linear-gradient(150deg, var(--c) 0%, var(--c2) 100%);box-shadow:0 26px 44px -24px color-mix(in srgb, var(--c) 80%, black), inset 0 1px 0 rgba(255,255,255,.22);overflow:hidden;isolation:isolate;}
.pass::before{content:'';position:absolute;inset:0;background:radial-gradient(120% 70% at 100% 0%, rgba(255,255,255,.22), transparent 60%);z-index:-1;}
.pass::after{content:'';position:absolute;right:-40px;bottom:-60px;width:180px;height:180px;border-radius:50%;border:26px solid color-mix(in srgb, var(--on) 8%, transparent);z-index:-1;}
.pass-top{display:flex;align-items:center;gap:12px;}
.pass-logo{width:42px;height:42px;border-radius:13px;background:color-mix(in srgb, var(--on) 18%, transparent);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.25rem;flex-shrink:0;backdrop-filter:blur(4px);}
.pass-id{flex:1;min-width:0;}
.pass-name{font-weight:800;font-size:1.05rem;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pass-kind{font-size:.7rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;opacity:.72;margin-top:2px;}
.pass-ready{font-size:.72rem;font-weight:800;padding:6px 10px;border-radius:999px;background:var(--on);color:var(--c2);white-space:nowrap;}
.pass-body{margin:20px 0 18px;}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;}
.stamp{aspect-ratio:1;border-radius:50%;border:2px dashed color-mix(in srgb, var(--on) 42%, transparent);display:grid;place-items:center;}
.stamp.on{border:none;background:var(--on);color:var(--c2);box-shadow:0 4px 10px -4px rgba(0,0,0,.3);}
.stamp.on svg{width:55%;height:55%;}
.stamp.gift{border-style:solid;border-color:color-mix(in srgb, var(--on) 60%, transparent);}
.pts{display:flex;align-items:baseline;gap:8px;}
.pts-num{font-family:var(--display);font-weight:700;font-size:3rem;line-height:1;letter-spacing:-.02em;}
.pts-of{font-weight:600;opacity:.8;}
.pbar{height:10px;border-radius:999px;background:color-mix(in srgb, var(--on) 22%, transparent);margin-top:14px;overflow:hidden;}
.pbar > span{display:block;height:100%;border-radius:999px;background:var(--on);}
.pass-meta{display:grid;grid-template-columns:1fr auto;gap:14px;padding-top:14px;border-top:1px dashed color-mix(in srgb, var(--on) 35%, transparent);}
.pass-meta .k{display:block;font-size:.66rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;opacity:.7;}
.pass-meta .v{display:block;font-weight:700;font-size:.92rem;margin-top:2px;}
.pass-meta div:last-child{text-align:right;}
.pass-qr{margin-top:16px;background:#fff;border-radius:16px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink);}
.pass-qr .qr{width:112px;height:112px;display:grid;place-items:center;}
.pass-qr .qr svg{width:112px;height:112px;display:block;}
.pass-qr small{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:.74rem;color:var(--muted);letter-spacing:.04em;}
.pass-tilt{transform:rotate(-3deg);margin:8px 6px 0;}

.wallet-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
.wallet-btn{height:48px;border-radius:12px;background:#000;color:#fff;border:none;font-family:var(--sans);font-weight:700;font-size:.82rem;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;}

/* ---------- Panel ---------- */
.biz-head{display:flex;align-items:center;gap:12px;}
.avatar{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.2rem;flex-shrink:0;}
.avatar.sm{width:40px;height:40px;border-radius:12px;font-size:.95rem;font-family:var(--sans);font-weight:800;}
.biz-name{font-weight:800;font-size:1.1rem;line-height:1.2;}
.code-chip{display:inline-flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:.76rem;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px 8px;margin-top:4px;cursor:pointer;}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);padding:5px;border-radius:16px;margin:20px 0 18px;box-shadow:var(--shadow);position:sticky;top:10px;z-index:5;}
.tabs button{border:none;background:transparent;height:42px;border-radius:12px;font-family:var(--sans);font-weight:700;font-size:.86rem;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;}
.tabs button.on{background:var(--ink);color:#fff;}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 12px;box-shadow:var(--shadow);}
.stat-ico{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;margin-bottom:10px;}
.stat-num{font-family:var(--display);font-weight:700;font-size:1.7rem;line-height:1;}
.stat-label{font-size:.74rem;color:var(--muted);font-weight:600;margin-top:4px;}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden;margin-top:14px;}
.item{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;}
.item + .item, .item-open + .item{border-top:1px solid var(--line);}
.item:active{background:var(--surface-2);}
.item-main{flex:1;min-width:0;}
.item-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.item-sub{font-size:.8rem;color:var(--muted);}
.item-prog{text-align:right;min-width:64px;}
.item-prog b{font-size:.9rem;}
.mini{height:5px;border-radius:999px;background:var(--line);margin-top:6px;overflow:hidden;}
.mini span{display:block;height:100%;border-radius:999px;}
.badge-ready{display:inline-block;font-size:.66rem;font-weight:800;color:#6B4700;background:#FFF1CF;padding:3px 7px;border-radius:999px;margin-top:4px;}
.item-open{padding:4px 16px 18px;background:var(--surface-2);border-top:1px solid var(--line);}
.empty{text-align:center;padding:36px 20px;color:var(--muted);}
.empty-ico{width:56px;height:56px;border-radius:18px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;margin:0 auto 12px;}
.kv{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;}
.kv + .kv{border-top:1px solid var(--line);}
.kv .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-weight:700;color:var(--ink);}
.success-ico{width:64px;height:64px;border-radius:22px;background:#E4F5EC;color:var(--ok);display:grid;place-items:center;margin-bottom:16px;}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:13px 18px;border-radius:14px;font-weight:600;font-size:.9rem;display:flex;align-items:center;gap:10px;z-index:50;box-shadow:var(--shadow-lg);max-width:calc(100% - 36px);animation:toast .25s ease both;}
.toast svg{color:var(--accent);flex-shrink:0;}
@keyframes toast{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@media (min-width:600px){.app-shell{padding-top:48px;}h1{font-size:2.5rem;}}
</style>
</head>

<script>
/* ---------- Utilidades ---------- */
function jsEsc(str){
  return String(str==null?'':str).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
}
function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}
function slugify(name){
  return String(name||'')
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-')
    .replace(/^-+|-+$/g,'')
    .slice(0,40) || 'negocio';
}
function fmtDate(iso){
  try{ return new Date(iso).toLocaleDateString('es-MX',{day:'numeric',month:'short'}); }catch(e){ return ''; }
}
const COLOR_SWATCHES = ['#E62E6B','#FFB627','#2C56A8','#1E8E5A','#8438B0','#E0472E','#1A1320'];

/* ---------- Conexión con el servidor ---------- */
function normalizePhone(raw){
  let d = String(raw||'').replace(/\D/g,'');
  if(d.length===12 && d.startsWith('52')) d = d.slice(2);
  if(d.length===13 && d.startsWith('521')) d = d.slice(3);
  return d;
}
async function api(method, path, body, pin){
  const headers = {};
  if(body!==undefined) headers['Content-Type'] = 'application/json';
  if(pin) headers['x-business-pin'] = pin;
  if(method==='POST' && path==='/api/businesses' && createForm.adminKey) headers['x-admin-key'] = createForm.adminKey;
  try{
    const res = await fetch(path, { method, headers, body: body!==undefined ? JSON.stringify(body) : undefined });
    let data = null;
    try{ data = await res.json(); }catch(e){}
    return { ok: res.ok, status: res.status, data: data || {} };
  }catch(e){
    return { ok:false, status:0, data:{ error:'No hay conexión con el servidor. Revisa tu internet e intenta de nuevo.' } };
  }
}
function errMsg(r, fallback){ return (r.data && r.data.error) || fallback; }
function enc(s){ return encodeURIComponent(s); }

const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
function customerLink(slug){ return location.origin + '/?n=' + enc(slug); }

/* ---------- Estado global ---------- */
let view = 'home';
let busy = false;
let toastMsg = null;
let toastTimer = null;
let serverConfig = { adminRequired:false, wallet:{ apple:false, google:false } };

let session = { slug:null, pin:null };
let cache = { biz:null, customers:[] };

let createForm = { name:'', mechanic:'sellos', stampsGoal:8, pointsGoal:100, pointsPerVisit:10, rewardDesc:'', color:COLOR_SWATCHES[0], pin:'', adminKey:'' };
let createError = '';

let loginForm = { slug:'', pin:'' };
let loginError = '';

let dashboardTab = 'resumen';
let customerSearch = '';
let expandedPhone = null;
let newCustomerOpen = false;
let newCustomerForm = { phone:'', name:'' };
let newCustomerError = '';
let pointsInputs = {};
let confirmRedeemPhone = null;

let configForm = null;
let configSaved = false;

let clienteLookup = { slug:'', phone:'' };
let clienteResult = { status:null, biz:null, customer:null };

function showToast(msg){
  toastMsg = msg;
  render();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ toastMsg=null; render(); }, 2800);
}

function goHome(){
  view='home'; createError=''; loginError=''; newCustomerError='';
  clienteResult={status:null,biz:null,customer:null};
  history.replaceState(null,'','/');
  render();
}

/* ---------- Acciones: negocio ---------- */
async function submitCrearNegocio(){
  createError='';
  const f = createForm;
  if(!f.name.trim()){ createError='Escribe el nombre de tu negocio.'; render(); return; }
  if(!f.rewardDesc.trim()){ createError='Describe el premio que da tu tarjeta.'; render(); return; }
  if(f.mechanic==='sellos' && !(Number(f.stampsGoal)>=2 && Number(f.stampsGoal)<=30)){ createError='Los sellos para el premio deben ser entre 2 y 30.'; render(); return; }
  if(f.mechanic==='puntos' && !(Number(f.pointsGoal)>=1 && Number(f.pointsPerVisit)>=1)){ createError='Completa los puntos del premio y los puntos por visita.'; render(); return; }
  if(!/^\d{4}$/.test(f.pin)){ createError='El PIN debe ser de 4 dígitos.'; render(); return; }
  if(serverConfig.adminRequired && !f.adminKey.trim()){ createError='Escribe la clave de administrador de P.A.E.'; render(); return; }

  busy = true; render();
  const r = await api('POST','/api/businesses',{
    name:f.name.trim(), mechanic:f.mechanic, stampsGoal:Number(f.stampsGoal), pointsGoal:Number(f.pointsGoal),
    pointsPerVisit:Number(f.pointsPerVisit), rewardDesc:f.rewardDesc.trim(), color:f.color, pin:f.pin
  });
  busy = false;
  if(!r.ok){ createError = errMsg(r,'No se pudo crear el negocio.'); render(); return; }
  cache.biz = { ...r.data, pin:f.pin };
  cache.customers = [];
  session = { slug:r.data.slug, pin:f.pin };
  store.set('vuelve_session', JSON.stringify(session));
  createForm = { ...createForm, name:'', rewardDesc:'', pin:'' };
  view = 'negocioExito';
  render();
}

async function loadDashboard(slug, pin){
  const r = await api('POST','/api/businesses/'+enc(slug)+'/login',{ pin });
  if(!r.ok) return r;
  const c = await api('GET','/api/businesses/'+enc(slug)+'/customers', undefined, pin);
  if(!c.ok) return c;
  cache.biz = { ...r.data, pin };
  cache.customers = Array.isArray(c.data) ? c.data : [];
  session = { slug:r.data.slug, pin };
  store.set('vuelve_session', JSON.stringify(session));
  return { ok:true };
}

async function submitLogin(){
  loginError='';
  const slug = slugify(loginForm.slug);
  if(!loginForm.slug.trim() || !loginForm.pin){ loginError='Escribe el código de tu negocio y tu PIN.'; render(); return; }
  busy = true; render();
  const r = await loadDashboard(slug, loginForm.pin);
  busy = false;
  if(!r.ok){ loginError = errMsg(r,'No se pudo entrar.'); render(); return; }
  loginForm = { slug:'', pin:'' };
  dashboardTab='resumen'; expandedPhone=null; customerSearch='';
  view = 'dashboard';
  render();
}

async function refreshCustomers(){
  if(!session.slug) return;
  const c = await api('GET','/api/businesses/'+enc(session.slug)+'/customers', undefined, session.pin);
  if(c.ok && Array.isArray(c.data)){ cache.customers = c.data; render(); }
}

function cerrarSesion(){
  session = {slug:null, pin:null}; cache = {biz:null, customers:[]};
  store.del('vuelve_session');
  goHome();
}

function handleAuthError(r){
  if(r.status===401){ showToast('Tu sesión ya no es válida. Entra de nuevo.'); setTimeout(cerrarSesion, 1200); return true; }
  return false;
}

/* ---------- Acciones: clientes (panel de negocio) ---------- */
function upsertCustomer(c){
  const i = cache.customers.findIndex(x=>x.phone===c.phone);
  if(i>=0) cache.customers[i] = { ...cache.customers[i], ...c };
  else cache.customers.unshift(c);
}

async function addCustomer(){
  newCustomerError='';
  const phone = normalizePhone(newCustomerForm.phone);
  if(phone.length<10){ newCustomerError='Escribe un teléfono de 10 dígitos.'; render(); return; }
  if(cache.customers.some(c=>c.phone===phone)){ newCustomerError='Ese teléfono ya tiene una tarjeta.'; render(); return; }
  busy=true; render();
  const r = await api('POST','/api/businesses/'+enc(session.slug)+'/customers',{ phone, name:newCustomerForm.name.trim() }, session.pin);
  busy=false;
  if(!r.ok){ if(handleAuthError(r)) return; newCustomerError = errMsg(r,'No se pudo guardar el cliente.'); render(); return; }
  upsertCustomer({ ...r.data, given:0 });
  newCustomerForm={phone:'',name:''}; newCustomerOpen=false;
  expandedPhone = r.data.phone; customerSearch='';
  showToast('Tarjeta creada para el cliente.');
}

async function addProgress(phone, amount){

  busy=true; render();
  const r = await api('POST','/api/businesses/'+enc(session.slug)+'/customers/'+enc(phone)+'/progress',{ amount }, session.pin);
  busy=false;
  if(!r.ok){ if(handleAuthError(r)) return; showToast(errMsg(r,'No se pudo sumar.')); return; }
  upsertCustomer(r.data);
  pointsInputs[phone]='';
  const unit = cache.biz.mechanic==='sellos' ? 'sello' : 'punto';
  const goal = goalOf(cache.biz);
  showToast(r.data.progress>=goal ? '¡Premio listo para este cliente!' : 'Se agregó '+amount+' '+unit+(amount===1?'':'s')+'.');
}

/* ---------- Acciones: cliente público ---------- */
async function buscarTarjetaCliente(){
  const slug = slugify(clienteLookup.slug);
  const phone = normalizePhone(clienteLookup.phone);
  if(!clienteLookup.slug.trim()){ showToast('Escribe el código del negocio.'); return; }
  if(phone.length<10){ showToast('Escribe tu teléfono de 10 dígitos.'); return; }
  busy=true; render();
  const b = await api('GET','/api/businesses/'+enc(slug));
  if(!b.ok){
    busy=false;
    if(b.status===404){ clienteResult = {status:'no_biz', biz:null, customer:null}; view='clienteTarjeta'; render(); }
    else showToast(errMsg(b,'No se pudo buscar tu tarjeta.'));
    return;
  }
  const c = await api('GET','/api/businesses/'+enc(slug)+'/customers/'+enc(phone));
  busy=false;
  if(!c.ok && c.status!==404){ showToast(errMsg(c,'No se pudo buscar tu tarjeta.')); return; }
  clienteResult = { status: c.ok ? 'found' : 'no_card', biz:b.data, customer: c.ok ? c.data : null };
  if(c.ok) store.set('vuelve_tel_'+slug, phone);
  view = 'clienteTarjeta';
  render();
}

async function addToWallet(kind){
  const { biz, customer } = clienteResult;
  if(!biz || !customer) return;
  if(!serverConfig.wallet[kind]){ showToast('Muy pronto podrás guardarla en tu Wallet.'); return; }
  if(kind==='apple'){
    location.href = '/api/businesses/'+enc(biz.slug)+'/wallet/apple/'+enc(customer.phone);
    return;
  }
  const r = await api('GET','/api/businesses/'+enc(biz.slug)+'/wallet/google/'+enc(customer.phone));
  if(r.ok && r.data.url) location.href = r.data.url;
  else showToast(errMsg(r,'No se pudo abrir Google Wallet.'));
}

/* ---------- Arranque ---------- */
async function boot(){
  const cfg = await api('GET','/api/config');
  if(cfg.ok) serverConfig = cfg.data;

  const params = new URLSearchParams(location.search);
  const n = params.get('n');
  if(n){
    const slug = slugify(n);
    clienteLookup.slug = slug;
    const saved = store.get('vuelve_tel_'+slug);
    if(saved){ clienteLookup.phone = saved; await buscarTarjetaCliente(); return; }
    view = 'clienteBuscar'; render(); return;
  }

  let saved = null;
  try{ saved = JSON.parse(store.get('vuelve_session')||'null'); }catch(e){}
  if(saved && saved.slug && saved.pin){
    busy = true; render();
    const r = await loadDashboard(saved.slug, saved.pin);
    busy = false;
    if(r.ok){ dashboardTab='resumen'; view='dashboard'; render(); return; }
    store.del('vuelve_session');
  }
  render();
}

/* ---------- Color ---------- */
function hexToRgb(hex){
  const h = String(hex||'#E62E6B').replace('#','');
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
function textOn(hex){
  const [r,g,b] = hexToRgb(hex).map(v=>{ v/=255; return v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055,2.4); });
  const lum = 0.2126*r + 0.7152*g + 0.0722*b;
  return lum > 0.45 ? '#1A1320' : '#FFFFFF';
}
function shade(hex, amt){
  const [r,g,b] = hexToRgb(hex);
  const f = v => Math.max(0, Math.min(255, Math.round(v + (amt/100)*(amt<0 ? v : 255-v))));
  return '#' + [f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function tint(hex){ const [r,g,b]=hexToRgb(hex); return `rgba(${r},${g},${b},0.12)`; }
function initialOf(name){ return (String(name||'?').trim()[0]||'?').toUpperCase(); }
function goalOf(biz){ return biz.mechanic==='sellos' ? Number(biz.stampsGoal) : Number(biz.pointsGoal); }

/* ---------- Tarjeta tipo Wallet ---------- */
function passHtml(biz, customer, opts){
  opts = opts || {};
  const goal = Math.max(1, goalOf(biz) || 1);
  const progress = customer ? Number(customer.progress)||0 : 0;
  const ready = customer && progress >= goal;
  const style = `--c:${biz.color};--c2:${shade(biz.color,-28)};--on:${textOn(biz.color)}`;
  let body;
  if(biz.mechanic==='sellos'){
    const shown = Math.min(goal, 30);
    let s='';
    for(let i=0;i<shown;i++){
      const filled = i < progress;
      const last = i === shown-1;
      s += `<span class="stamp ${filled?'on':''} ${!filled&&last?'gift':''}">${filled?ic('check'):(last?ic('gift',16):'')}</span>`;
    }
    body = `<div class="stamps">${s}</div>`;
  }else{
    const pct = Math.max(0, Math.min(100, Math.round(progress/goal*100)));
    body = `<div class="pts"><span class="pts-num">${progress}</span><span class="pts-of">de ${goal} puntos</span></div><div class="pbar"><span style="width:${pct}%"></span></div>`;
  }
  const who = customer ? (customer.name || customer.phone || 'Cliente') : 'Tus clientes';
  const qr = (opts.qr && customer && customer.phone)
    ? `<div class="pass-qr"><div class="qr" data-qr="${escapeHtml(biz.slug+':'+customer.phone)}"></div><small>${escapeHtml(biz.slug)} · ${escapeHtml(customer.phone)}</small></div>` : '';
  return `
  <div class="pass ${opts.tilt?'pass-tilt':''}" style="${style}">
    <div class="pass-top">
      <div class="pass-logo">${escapeHtml(initialOf(biz.name))}</div>
      <div class="pass-id"><div class="pass-name">${escapeHtml(biz.name)}</div><div class="pass-kind">Tarjeta de lealtad</div></div>
      ${ready ? `<span class="pass-ready">Premio listo</span>` : ''}
    </div>
    <div class="pass-body">${body}</div>
    <div class="pass-meta">
      <div><span class="k">Premio</span><span class="v">${escapeHtml(biz.rewardDesc)}</span></div>
      <div><span class="k">${biz.mechanic==='sellos'?'Sellos':'Nivel'}</span><span class="v">${biz.mechanic==='sellos' ? Math.min(progress,goal)+'/'+goal : escapeHtml(who)}</span></div>
    </div>
    ${qr}
  </div>`;
}
// Compatibilidad con el nombre anterior
function ticketCardHtml(biz, customer){ return passHtml(biz, customer, {}); }

function hydrateQR(){
  if(!document.querySelectorAll) return;
  document.querySelectorAll('[data-qr]').forEach(el=>{
    try{
      if(typeof qrcode==='function'){
        const q = qrcode(0,'M');
        q.addData(el.getAttribute('data-qr'));
        q.make();
        el.innerHTML = q.createSvgTag({cellSize:4, margin:0, scalable:true});
      }else{
        el.innerHTML = ic('card',40);
      }
    }catch(e){ el.innerHTML = ic('card',40); }
  });
}

function copyText(t, label){
  label = label || 'Código copiado';
  try{
    navigator.clipboard.writeText(t).then(()=>showToast(label)).catch(()=>showToast(t));
  }catch(e){ showToast(t); }
}

    <div class="card mt-24">
      <div class="field">
        <label for="l-slug">Código del negocio</label>
        <div class="input-icon">${ic('store',18)}<input id="l-slug" class="input" type="text" autocapitalize="none" value="${escapeHtml(loginForm.slug)}" placeholder="cafe-luna" oninput="loginForm.slug=this.value"></div>
      </div>
      <div class="field">
        <label for="l-pin">PIN</label>
        <input id="l-pin" class="input code" type="password" inputmode="numeric" maxlength="4" value="${escapeHtml(loginForm.pin)}" placeholder="••••" oninput="loginForm.pin=this.value.replace(/\\D/g,'').slice(0,4);this.value=loginForm.pin">
      </div>
      ${errorHtml(loginError)}
    </div>
    <button class="btn btn-primary btn-block mt-24" ${busy?'disabled':''} onclick="submitLogin()">${busy?'Entrando…':'Entrar'}</button>
  </div>`;
}

function viewDashboard(){
  const biz = cache.biz;
  return `
  <div class="wrap fade">
    <div class="topbar" style="margin-bottom:0">
      <div class="biz-head">
        <div class="avatar" style="background:${biz.color};color:${textOn(biz.color)}">${escapeHtml(initialOf(biz.name))}</div>
        <div>
          <div class="biz-name">${escapeHtml(biz.name)}</div>
          <span class="code-chip" onclick="copyText('${jsEsc(biz.slug)}')">${ic('copy',12)} ${escapeHtml(biz.slug)}</span>
        </div>
      </div>
      <button class="icon-btn" aria-label="Cerrar sesión" onclick="cerrarSesion()">${ic('logout',18)}</button>
    </div>
    ${serverConfig.storageWarning ? `<div class="error mt-16">${ic('info',18)}<span>Aviso para P.A.E.: el servidor no tiene disco permanente. Agrega un volumen en Railway antes de dar de alta clientes reales.</span></div>` : ''}
    <div class="tabs" role="tablist">
      <button class="${dashboardTab==='resumen'?'on':''}" onclick="dashboardTab='resumen';render()">${ic('chart',16)} Resumen</button>
      <button class="${dashboardTab==='clientes'?'on':''}" onclick="dashboardTab='clientes';expandedPhone=null;render();refreshCustomers()">${ic('users',16)} Clientes</button>
      <button class="${dashboardTab==='config'?'on':''}" onclick="openConfig()">${ic('sliders',16)} Ajustes</button>
    </div>
    ${dashboardTab==='resumen' ? dashboardResumen() : ''}
    ${dashboardTab==='clientes' ? dashboardClientes() : ''}
    ${dashboardTab==='config' ? dashboardConfig() : ''}
  </div>`;
}

function dashboardResumen(){
  const cs = cache.customers;
  const isSellos = cache.biz.mechanic==='sellos';
  const totalGiven = cs.reduce((sum,c)=>sum + (Number(c.given)||0), 0);
  const totalRedeem = cs.reduce((sum,c)=>sum + c.redemptions, 0);
  const goal = goalOf(cache.biz);
  const readyCount = cs.filter(c=>c.progress>=goal).length;
  return `
    <div class="stats">
      <div class="stat"><div class="stat-ico" style="background:var(--brand-soft);color:var(--brand)">${ic('users',17)}</div><div class="stat-num">${cs.length}</div><div class="stat-label">Clientes</div></div>
      <div class="stat"><div class="stat-ico" style="background:#EEF1FB;color:#2C56A8">${ic(isSellos?'stamp':'coin',17)}</div><div class="stat-num">${totalGiven}</div><div class="stat-label">${isSellos?'Sellos dados':'Puntos dados'}</div></div>
      <div class="stat"><div class="stat-ico" style="background:#FFF1CF;color:#8A5B00">${ic('gift',17)}</div><div class="stat-num">${totalRedeem}</div><div class="stat-label">Premios</div></div>
    </div>
    ${readyCount ? `<div class="card mt-12" style="display:flex;gap:12px;align-items:center;cursor:pointer" onclick="dashboardTab='clientes';render()"><span class="choice-icon" style="background:#FFF1CF;color:#8A5B00;width:40px;height:40px">${ic('gift',20)}</span><span style="flex:1"><b>${readyCount} ${readyCount===1?'cliente tiene':'clientes tienen'} premio listo</b><span class="muted small" style="display:block">Toca para verlos</span></span>${ic('right')}</div>` : ''}
    <p class="eyebrow mt-24">Tu tarjeta</p>
    <div class="mt-12">${passHtml(cache.biz, null, {})}</div>
  `;
}

function dashboardClientes(){
  const q = customerSearch.trim();
  const list = cache.customers.filter(c => !q || c.phone.includes(q) || (c.name||'').toLowerCase().includes(q.toLowerCase()));
  const biz = cache.biz;
  const goal = goalOf(biz);

  const rows = list.map(c => {
    const isOpen = expandedPhone===c.phone;
    const ready = c.progress >= goal;
    const pct = Math.max(0, Math.min(100, Math.round(c.progress/goal*100)));
    let row = `
      <div class="item" onclick="expandedPhone = expandedPhone==='${jsEsc(c.phone)}' ? null : '${jsEsc(c.phone)}'; confirmRedeemPhone=null; render()">
        <div class="avatar sm" style="background:${tint(biz.color)};color:${shade(biz.color,-30)}">${escapeHtml(initialOf(c.name||c.phone))}</div>
        <div class="item-main"><div class="item-name">${escapeHtml(c.name||'Sin nombre')}</div><div class="item-sub">${escapeHtml(c.phone)}</div></div>
        <div class="item-prog"><b>${c.progress}/${goal}</b><div class="mini"><span style="width:${pct}%;background:${biz.color}"></span></div>${ready?'<span class="badge-ready">Premio listo</span>':''}</div>
      </div>`;
    if(isOpen){
      row += `<div class="item-open"><div class="mt-12">${passHtml(biz, c, {qr:true})}</div><div class="stack mt-16">`;
      if(biz.mechanic==='sellos'){
        row += `<button class="btn btn-primary btn-block" ${busy?'disabled':''} onclick="event.stopPropagation();addProgress('${jsEsc(c.phone)}',1)">${ic('stamp')} Dar 1 sello</button>`;
      }else{
        const val = pointsInputs[c.phone] || biz.pointsPerVisit;
        row += `<div class="row"><input class="input" type="number" min="1" value="${val}" style="max-width:110px" oninput="pointsInputs['${jsEsc(c.phone)}']=this.value" onclick="event.stopPropagation()">
          <button class="btn btn-primary" style="flex:1" ${busy?'disabled':''} onclick="event.stopPropagation();addProgress('${jsEsc(c.phone)}', Number(pointsInputs['${jsEsc(c.phone)}'] || ${biz.pointsPerVisit}))">${ic('plus')} Sumar puntos</button></div>`;
      }
      if(confirmRedeemPhone===c.phone){
        row += `<div class="card" style="box-shadow:none"><p style="font-weight:700">¿Canjear el premio?</p><p class="muted small mt-8">Se descontarán ${goal} ${biz.mechanic==='sellos'?'sellos':'puntos'} de su tarjeta.</p>
          <div class="row mt-16"><button class="btn btn-gold" style="flex:1" ${busy?'disabled':''} onclick="event.stopPropagation();confirmRedeem('${jsEsc(c.phone)}')">Sí, canjear</button>
          <button class="btn btn-ghost" onclick="event.stopPropagation();cancelRedeem()">Cancelar</button></div></div>`;
      }else{
        row += `<button class="btn ${ready?'btn-gold':'btn-secondary'} btn-block" ${ready?'':'disabled'} onclick="event.stopPropagation();askRedeem('${jsEsc(c.phone)}')">${ic('gift')} ${ready?'Canjear premio':'Aún no alcanza el premio'}</button>`;
      }
      row += `</div></div>`;
    }
    return row;
  }).join('');

  const empty = `<div class="empty"><div class="empty-ico">${ic('users',26)}</div><b style="color:var(--ink)">${q?'Sin resultados':'Aún no tienes clientes'}</b><p class="small mt-8">${q?'Prueba con otro nombre o teléfono.':'Da de alta a tu primer cliente con su teléfono.'}</p></div>`;

  return `
    <div class="input-icon">${ic('search',18)}<input class="input" type="search" placeholder="Buscar por nombre o teléfono" value="${escapeHtml(customerSearch)}" oninput="customerSearch=this.value;render();var i=document.querySelector('input[type=search]');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}"></div>
    ${newCustomerOpen ? `
      <div class="card mt-12">
        <div class="card-title">${ic('user',18)} Nuevo cliente</div>
        <div class="field"><label for="n-phone">Teléfono</label><input id="n-phone" class="input" type="tel" inputmode="tel" value="${escapeHtml(newCustomerForm.phone)}" oninput="newCustomerForm.phone=this.value" placeholder="222 123 4567"></div>
        <div class="field"><label for="n-name">Nombre <span class="muted">(opcional)</span></label><input id="n-name" class="input" type="text" value="${escapeHtml(newCustomerForm.name)}" oninput="newCustomerForm.name=this.value" placeholder="Ana"></div>
        ${errorHtml(newCustomerError)}
        <div class="row mt-16"><button class="btn btn-primary" style="flex:1" ${busy?'disabled':''} onclick="addCustomer()">Guardar cliente</button><button class="btn btn-ghost" onclick="newCustomerOpen=false;newCustomerError='';render()">Cancelar</button></div>
      </div>
    ` : `<button class="btn btn-secondary btn-block mt-12" onclick="newCustomerOpen=true;newCustomerForm={phone:'',name:''};render()">${ic('plus')} Nuevo cliente</button>`}
    ${list.length ? `<div class="list">${rows}</div>` : `<div class="card mt-12">${empty}</div>`}
  `;
}

function dashboardConfig(){
  const f = configForm;
  const isSellos = cache.biz.mechanic==='sellos';
  return `
    <div class="card">
      <div class="card-title">${ic('lock',18)} Acceso</div>
      <div class="kv"><span class="muted small">Código del negocio</span><button class="btn btn-secondary btn-sm" onclick="copyText('${jsEsc(cache.biz.slug)}')">${ic('copy',16)} <span class="mono">${escapeHtml(cache.biz.slug)}</span></button></div>
      <div class="kv"><span class="muted small">PIN</span><span class="mono">${escapeHtml(cache.biz.pin)}</span></div>
      <div class="kv"><span class="muted small">Liga para tus clientes</span><button class="btn btn-secondary btn-sm" onclick="copyText('${jsEsc(customerLink(cache.biz.slug))}','Liga copiada')">${ic('copy',16)} Copiar liga</button></div>
    </div>
    <div class="card">
      <div class="card-title">${ic('gift',18)} Premio y meta</div>
      <div class="field"><label for="c-reward">Premio</label><input id="c-reward" class="input" type="text" value="${escapeHtml(f.rewardDesc)}" oninput="configForm.rewardDesc=this.value"></div>
      ${isSellos ? `
      <div class="field"><label for="c-goal">Sellos para el premio</label><input id="c-goal" class="input" type="number" min="2" max="30" value="${f.stampsGoal}" oninput="configForm.stampsGoal=this.value"></div>` : `
      <div class="field"><label for="c-pgoal">Puntos para el premio</label><input id="c-pgoal" class="input" type="number" min="1" value="${f.pointsGoal}" oninput="configForm.pointsGoal=this.value"></div>
      <div class="field"><label for="c-ppv">Puntos por visita</label><input id="c-ppv" class="input" type="number" min="1" value="${f.pointsPerVisit}" oninput="configForm.pointsPerVisit=this.value"></div>`}
    </div>
    <div class="card">
      <div class="card-title">${ic('palette',18)} Color de marca</div>
      <div class="swatches">
        ${COLOR_SWATCHES.map(c=>`<button class="swatch ${f.color===c?'on':''}" style="background:${c};color:${textOn(c)}" aria-label="Color ${c}" onclick="configForm.color='${c}';render()">${f.color===c?ic('check',16):''}</button>`).join('')}
      </div>
      <div class="mt-16">${passHtml({...cache.biz, color:f.color, rewardDesc:f.rewardDesc||cache.biz.rewardDesc, stampsGoal:f.stampsGoal, pointsGoal:f.pointsGoal}, null, {})}</div>
    </div>
    <button class="btn btn-primary btn-block mt-24" ${busy?'disabled':''} onclick="saveConfig()">${busy?'Guardando…':'Guardar cambios'}</button>
  `;
}

function viewClienteBuscar(){
  return `
  <div class="wrap fade">
    ${backHtml('goHome()')}
    <h2 class="mt-12">Ver mi tarjeta</h2>
    <p class="lead">Pide el código en el mostrador del negocio.</p>
    <div class="card mt-24">
      <div class="field"><label for="s-slug">Código del negocio</label><div class="input-icon">${ic('store',18)}<input id="s-slug" class="input" type="text" autocapitalize="none" value="${escapeHtml(clienteLookup.slug)}" placeholder="cafe-luna" oninput="clienteLookup.slug=this.value"></div></div>
      <div class="field"><label for="s-phone">Tu teléfono</label><div class="input-icon">${ic('phone',18)}<input id="s-phone" class="input" type="tel" inputmode="tel" value="${escapeHtml(clienteLookup.phone)}" placeholder="222 123 4567" oninput="clienteLookup.phone=this.value"></div></div>
    </div>
    <button class="btn btn-primary btn-block mt-24" ${busy?'disabled':''} onclick="buscarTarjetaCliente()">${busy?'Buscando…':'Ver mi tarjeta'}</button>
  </div>`;
}

function viewClienteTarjeta(){
  const {status, biz, customer} = clienteResult;
  let body;
  if(status==='no_biz'){
    body = `<div class="card mt-24"><div class="empty"><div class="empty-ico">${ic('store',26)}</div><b style="color:var(--ink)">No encontramos ese negocio</b><p class="small mt-8">Revisa el código con el personal del negocio.</p></div></div>`;
  }else if(status==='no_card'){
    body = `<div class="card mt-24"><div class="empty"><div class="empty-ico">${ic('card',26)}</div><b style="color:var(--ink)">Aún no tienes tarjeta en ${escapeHtml(biz.name)}</b><p class="small mt-8">Pide que te den de alta en tu próxima visita.</p></div></div>`;
  }else{
    const goal = goalOf(biz);
    const left = Math.max(0, goal - customer.progress);
    body = `
      <h2 class="mt-12">Hola${customer.name?', '+escapeHtml(customer.name):''}</h2>
      <p class="lead">${left===0 ? '¡Ya tienes tu premio! Muéstrale esta tarjeta al personal.' : `Te ${left===1?'falta':'faltan'} ${left} ${biz.mechanic==='sellos'?(left===1?'sello':'sellos'):(left===1?'punto':'puntos')} para tu premio.`}</p>
      <div class="mt-24">${passHtml(biz, customer, {qr:true})}</div>
      <div class="wallet-btns">
        <button class="wallet-btn" onclick="addToWallet('apple')">${ic('wallet',18)} Apple Wallet</button>
        <button class="wallet-btn" onclick="addToWallet('google')">${ic('wallet',18)} Google Wallet</button>
      </div>`;
  }
  return `
  <div class="wrap fade">
    <button class="back" onclick="view='clienteBuscar';render()">${ic('left',18)} Buscar otra tarjeta</button>
    ${body}
  </div>`;
}

function viewCargando(){
  return `<div class="wrap fade"><div class="topbar">${logoHtml()}</div><div class="empty"><p class="muted">Cargando…</p></div></div>`;
}

/* ---------- Render principal ---------- */
function render(){
  let html;
  switch(view){
    case 'negocioAuth': html = viewNegocioAuth(); break;
    case 'negocioCrear': html = viewNegocioCrear(); break;
    case 'negocioExito': html = viewNegocioExito(); break;
    case 'negocioEntrar': html = viewNegocioEntrar(); break;
    case 'dashboard': html = viewDashboard(); break;
    case 'clienteBuscar': html = viewClienteBuscar(); break;
    case 'clienteTarjeta': html = viewClienteTarjeta(); break;
    case 'cargando': html = viewCargando(); break;
    default: html = viewHome();
  }
  document.getElementById('app').innerHTML = `<div class="app-shell">${html}</div>${toastHtml()}`;
  hydrateQR();
}
view = 'cargando';
render();
boot().then(()=>{ if(view==='cargando'){ view='home'; render(); } });
</script>
</body>
</html>
