<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vuelve — Tarjetas de lealtad digitales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F2ED; --surface:#FFFFFF; --surface-2:#FBF9F6;
  --ink:#1A1320; --ink-2:#4A4150; --muted:#8A8190; --line:#EAE3DC;
  --brand:#E62E6B; --brand-deep:#B3174D; --brand-soft:#FDE7EF;
  --accent:#FFB627; --ok:#1E8E5A; --danger:#D23A2A;
  --r-sm:10px; --r:14px; --r-lg:20px;
  --shadow:0 1px 2px rgba(26,19,32,.05), 0 8px 24px -12px rgba(26,19,32,.14);
  --shadow-lg:0 2px 4px rgba(26,19,32,.04), 0 24px 48px -20px rgba(26,19,32,.28);
  --display:'Fraunces', Georgia, serif;
  --sans:'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}
.app-shell{min-height:100vh;padding:max(20px, env(safe-area-inset-top)) 18px calc(80px + env(safe-area-inset-bottom));}
.wrap{max-width:460px;margin:0 auto;}
.fade{animation:fade .28s ease both;}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}

h1,h2,h3{margin:0;color:var(--ink);}
h1{font-family:var(--display);font-weight:700;font-size:2.15rem;line-height:1.08;letter-spacing:-.02em;}
h2{font-family:var(--display);font-weight:700;font-size:1.6rem;line-height:1.15;letter-spacing:-.01em;}
h3{font-size:1rem;font-weight:700;}
p{margin:0;}
.lead{color:var(--ink-2);font-size:1rem;margin-top:10px;}
.muted{color:var(--muted);}
.small{font-size:.84rem;}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}.mt-24{margin-top:24px}.mt-32{margin-top:32px}
:focus-visible{outline:3px solid color-mix(in srgb, var(--brand) 45%, transparent);outline-offset:2px;border-radius:8px;}

.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;min-height:40px;}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-style:italic;font-size:1.45rem;color:var(--ink);}
.logo-mark{width:34px;height:34px;border-radius:11px;background:var(--brand);color:#fff;display:grid;place-items:center;font-style:normal;font-size:1.05rem;transform:rotate(-6deg);box-shadow:0 6px 14px -6px var(--brand);}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);display:grid;place-items:center;cursor:pointer;}
.icon-btn:active{transform:scale(.96);}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);font-weight:600;font-size:.92rem;cursor:pointer;background:none;border:none;padding:8px 0;font-family:var(--sans);}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 20px;border-radius:var(--r);border:none;font-family:var(--sans);font-size:.98rem;font-weight:700;cursor:pointer;transition:transform .12s ease, box-shadow .2s ease, background .2s ease;white-space:nowrap;}
.btn:active{transform:scale(.98);}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}
.btn-primary{background:var(--brand);color:#fff;box-shadow:0 10px 22px -12px var(--brand), inset 0 1px 0 rgba(255,255,255,.18);}
.btn-primary:hover:not(:disabled){background:var(--brand-deep);}
.btn-secondary{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow);}
.btn-dark{background:var(--ink);color:#fff;}
.btn-gold{background:var(--accent);color:#3A2600;box-shadow:0 10px 22px -12px var(--accent);}
.btn-ghost{background:transparent;color:var(--ink-2);height:44px;}
.btn-block{width:100%;}
.btn-sm{height:42px;font-size:.9rem;padding:0 14px;border-radius:12px;}
.row{display:flex;gap:10px;align-items:center;}
.stack{display:flex;flex-direction:column;gap:12px;}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow);}
.card + .card{margin-top:12px;}
.card-title{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:14px;color:var(--ink);}
.card-title svg{color:var(--brand);}

.field + .field{margin-top:16px;}
label{display:block;font-size:.82rem;font-weight:700;color:var(--ink-2);margin-bottom:8px;}
.input{width:100%;height:50px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);font-family:var(--sans);font-size:1rem;transition:border-color .15s, background .15s, box-shadow .15s;}
.input:focus{outline:none;border-color:var(--brand);background:#fff;box-shadow:0 0 0 4px var(--brand-soft);}
.input.code{font-family:ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.3em;font-size:1.1rem;}
.input-icon{position:relative;}
.input-icon svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;}
.input-icon .input{padding-left:42px;}
.hint{font-size:.8rem;color:var(--muted);margin-top:7px;}
.error{display:flex;gap:8px;align-items:center;background:#FDECEA;color:var(--danger);font-weight:600;font-size:.88rem;padding:11px 14px;border-radius:12px;margin-top:16px;}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface-2);border:1px solid var(--line);padding:5px;border-radius:14px;}
.seg button{border:none;background:transparent;height:46px;border-radius:10px;font-family:var(--sans);font-weight:700;font-size:.92rem;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);}
.seg button.on svg{color:var(--brand);}

.swatches{display:flex;gap:10px;flex-wrap:wrap;}
.swatch{width:36px;height:36px;border-radius:50%;border:none;cursor:pointer;position:relative;display:grid;place-items:center;color:#fff;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);}
.swatch.on{box-shadow:0 0 0 3px var(--surface), 0 0 0 5px var(--ink);}

.choice{display:flex;align-items:center;gap:14px;padding:18px;cursor:pointer;text-align:left;width:100%;font-family:var(--sans);}
.choice:active{transform:scale(.99);}
.choice-icon{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex-shrink:0;}
.choice-body{flex:1;}
.choice-title{font-weight:700;font-size:1rem;color:var(--ink);}
.choice-desc{font-size:.86rem;color:var(--muted);margin-top:2px;}
.choice > svg:last-child{color:var(--muted);}

.chips{display:flex;flex-wrap:wrap;gap:8px;}
.pick{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:999px;background:var(--surface-2);border:1.5px solid var(--line);font-family:var(--sans);font-size:.86rem;font-weight:600;color:var(--ink-2);cursor:pointer;}
.pick.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-deep);}
.pick .rm{display:grid;place-items:center;color:var(--muted);}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 0;cursor:pointer;font-size:.9rem;color:var(--ink-2);line-height:1.45;}
.check input{width:22px;height:22px;margin:0;flex-shrink:0;accent-color:var(--brand);}
.check + .check{border-top:1px solid var(--line);}
.linkbtn{background:none;border:none;padding:0;color:var(--brand-deep);font-weight:700;font-family:var(--sans);font-size:inherit;text-decoration:underline;cursor:pointer;}
.privacy{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:.82rem;line-height:1.55;color:var(--ink-2);margin-top:4px;}
.privacy p + p{margin-top:8px;}
.ficha{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 14px;}
.ficha .kv{padding:10px 0;}
.fav-rank{display:flex;align-items:center;gap:10px;padding:10px 0;}
.fav-rank + .fav-rank{border-top:1px solid var(--line);}
.fav-rank b{flex:1;}
.quick{width:44px;height:44px;border-radius:14px;border:none;background:var(--brand-soft);color:var(--brand-deep);display:grid;place-items:center;flex-shrink:0;cursor:pointer;font-family:var(--sans);font-weight:800;font-size:.8rem;}
.quick:active{transform:scale(.94);}
.quick:disabled{opacity:.4;}
.scan-cta{display:flex;align-items:center;gap:12px;width:100%;padding:16px;border-radius:var(--r-lg);border:none;background:var(--ink);color:#fff;font-family:var(--sans);cursor:pointer;text-align:left;box-shadow:var(--shadow);}
.scan-cta .ico{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.12);display:grid;place-items:center;flex-shrink:0;}
.scan-cta b{display:block;font-size:1rem;}
.scan-cta span.s{font-size:.8rem;opacity:.7;}
#scanner{position:fixed;inset:0;z-index:100;background:#000;}
#scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
#scanner .frame{position:absolute;left:50%;top:44%;width:min(70vw,300px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:24px;box-shadow:0 0 0 9999px rgba(0,0,0,.55);border:3px solid #fff;}
#scanner .hint{position:absolute;left:0;right:0;top:calc(44% + min(35vw,150px) + 24px);text-align:center;color:#fff;font-family:var(--sans);font-weight:700;padding:0 24px;}
#scanner .close{position:absolute;left:50%;bottom:calc(32px + env(safe-area-inset-bottom));transform:translateX(-50%);height:52px;padding:0 28px;border-radius:999px;border:none;background:#fff;color:#1A1320;font-family:var(--sans);font-weight:800;font-size:1rem;}
.sheet-bg{position:fixed;inset:0;z-index:60;background:rgba(26,19,32,.45);display:flex;align-items:flex-end;justify-content:center;}
.sheet{width:100%;max-width:480px;background:var(--bg);border-radius:24px 24px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));box-shadow:var(--shadow-lg);max-height:92vh;overflow:auto;}
.sheet-grip{width:40px;height:5px;border-radius:999px;background:var(--line);margin:0 auto 16px;}
@media (min-width:600px){.sheet-bg{align-items:center}.sheet{border-radius:24px}}
.invite{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center;}
.invite .qr-box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;}
.invite .qr-box svg{width:100%;height:auto;display:block;}
.invite-link{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:.74rem;color:var(--ink-2);word-break:break-all;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;}
.invite-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px;}
.invite-btns .btn{height:46px;padding:0 8px;font-size:.82rem;flex-direction:column;gap:2px;}
@media (max-width:380px){.invite{grid-template-columns:96px 1fr;}}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:.8rem;font-weight:600;color:var(--ink-2);}
.chip svg{color:var(--brand);}

/* ---------- Tarjeta tipo Wallet ---------- */
.pass{position:relative;border-radius:22px;padding:20px 20px 18px;color:var(--on);background:linear-gradient(150deg, var(--c) 0%, var(--c2) 100%);box-shadow:0 26px 44px -24px color-mix(in srgb, var(--c) 80%, black), inset 0 1px 0 rgba(255,255,255,.22);overflow:hidden;isolation:isolate;}
.pass::before{content:'';position:absolute;inset:0;background:radial-gradient(120% 70% at 100% 0%, rgba(255,255,255,.22), transparent 60%);z-index:-1;}
.pass::after{content:'';position:absolute;right:-40px;bottom:-60px;width:180px;height:180px;border-radius:50%;border:26px solid color-mix(in srgb, var(--on) 8%, transparent);z-index:-1;}
.pass-top{display:flex;align-items:center;gap:12px;}
.pass-logo{width:42px;height:42px;border-radius:13px;background:color-mix(in srgb, var(--on) 18%, transparent);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.25rem;flex-shrink:0;backdrop-filter:blur(4px);}
.pass-id{flex:1;min-width:0;}
.pass-name{font-weight:800;font-size:1.05rem;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pass-kind{font-size:.7rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;opacity:.72;margin-top:2px;}
.pass-ready{font-size:.72rem;font-weight:800;padding:6px 10px;border-radius:999px;background:var(--on);color:var(--c2);white-space:nowrap;}
.pass-body{margin:20px 0 18px;}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;}
.stamp{aspect-ratio:1;border-radius:50%;border:2px dashed color-mix(in srgb, var(--on) 42%, transparent);display:grid;place-items:center;}
.stamp.on{border:none;background:var(--on);color:var(--c2);box-shadow:0 4px 10px -4px rgba(0,0,0,.3);}
.stamp.on svg{width:55%;height:55%;}
.stamp.gift{border-style:solid;border-color:color-mix(in srgb, var(--on) 60%, transparent);}
.pts{display:flex;align-items:baseline;gap:8px;}
.pts-num{font-family:var(--display);font-weight:700;font-size:3rem;line-height:1;letter-spacing:-.02em;}
.pts-of{font-weight:600;opacity:.8;}
.pbar{height:10px;border-radius:999px;background:color-mix(in srgb, var(--on) 22%, transparent);margin-top:14px;overflow:hidden;}
.pbar > span{display:block;height:100%;border-radius:999px;background:var(--on);}
.pass-meta{display:grid;grid-template-columns:1fr auto;gap:14px;padding-top:14px;border-top:1px dashed color-mix(in srgb, var(--on) 35%, transparent);}
.pass-meta .k{display:block;font-size:.66rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;opacity:.7;}
.pass-meta .v{display:block;font-weight:700;font-size:.92rem;margin-top:2px;}
.pass-meta div:last-child{text-align:right;}
.pass-qr{margin-top:16px;background:#fff;border-radius:16px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink);}
.pass-qr .qr{width:112px;height:112px;display:grid;place-items:center;}
.pass-qr .qr svg{width:112px;height:112px;display:block;}
.pass-qr small{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:.74rem;color:var(--muted);letter-spacing:.04em;}
.pass-tilt{transform:rotate(-3deg);margin:8px 6px 0;}
.pass.solid{background:var(--c);}
.pass.solid::before,.pass.solid::after{display:none;}
.pass.pattern{background-image:var(--pat),linear-gradient(150deg, var(--c) 0%, var(--c2) 100%);background-size:38px 38px,auto;}
.pass-logo img{width:100%;height:100%;object-fit:contain;border-radius:inherit;background:#fff;padding:4px;}
.pass-logo.has-img{background:#fff;padding:0;}
.plan-pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 9px;border-radius:999px;font-size:.68rem;font-weight:800;letter-spacing:.04em;vertical-align:middle;}
.plan-pill.premium{background:linear-gradient(135deg,#FFD978,#FFB627);color:#5A3A00;}
.plan-pill.esencial{background:var(--surface);border:1px solid var(--line);color:var(--muted);}
.locked{position:relative;}
.locked .lock-body{opacity:.42;pointer-events:none;filter:grayscale(.3);}
.lock-note{display:flex;align-items:center;gap:8px;margin-top:12px;padding:10px 12px;border-radius:12px;background:#FFF6DC;color:#6B4700;font-size:.82rem;font-weight:700;}
.lock-badge{position:absolute;top:-30px;right:0;display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 9px;border-radius:999px;background:#FFF6DC;color:#6B4700;font-size:.68rem;font-weight:800;letter-spacing:.03em;}
.upsell{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;background:linear-gradient(135deg,#FFF6DC,#FFEFC2);color:#5A3A00;margin-bottom:18px;}
.upsell svg{flex-shrink:0;margin-top:1px;}
.upsell b{display:block;font-size:.92rem;margin-bottom:2px;}
.upsell p{margin:0;font-size:.82rem;line-height:1.45;}
.icon-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
.icon-opt{aspect-ratio:1;border-radius:14px;border:1.5px solid var(--line);background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2);cursor:pointer;}
.icon-opt.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-deep);}
.icon-opt svg{width:24px;height:24px;}
.style-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.style-opt{border:1.5px solid var(--line);border-radius:14px;padding:8px;background:var(--surface);cursor:pointer;font-family:var(--sans);font-size:.78rem;font-weight:700;color:var(--ink-2);}
.style-opt.on{border-color:var(--brand);color:var(--brand-deep);}
.style-opt .sw{height:44px;border-radius:10px;margin-bottom:6px;}
.color-row{display:flex;align-items:center;gap:10px;margin-top:12px;}
.color-row input[type=color]{width:50px;height:50px;border:1.5px solid var(--line);border-radius:12px;padding:3px;background:var(--surface);cursor:pointer;}
.logo-row{display:flex;align-items:center;gap:14px;}
.logo-box{width:72px;height:72px;border-radius:18px;border:1.5px dashed var(--line);background:#fff;display:grid;place-items:center;overflow:hidden;flex-shrink:0;color:var(--muted);}
.logo-box img{width:100%;height:100%;object-fit:contain;padding:6px;}
.preview-sticky{position:sticky;top:78px;z-index:4;padding-bottom:6px;}

.wallet-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
.wallet-btn{height:48px;border-radius:12px;background:#000;color:#fff;border:none;font-family:var(--sans);font-weight:700;font-size:.82rem;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;}

/* ---------- Panel ---------- */
.biz-head{display:flex;align-items:center;gap:12px;}
.avatar{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.2rem;flex-shrink:0;}
.avatar.sm{width:40px;height:40px;border-radius:12px;font-size:.95rem;font-family:var(--sans);font-weight:800;}
.biz-name{font-weight:800;font-size:1.1rem;line-height:1.2;}
.code-chip{display:inline-flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:.76rem;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px 8px;margin-top:4px;cursor:pointer;}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);padding:5px;border-radius:16px;margin:20px 0 18px;box-shadow:var(--shadow);position:sticky;top:10px;z-index:5;}
.tabs button{border:none;background:transparent;height:42px;border-radius:12px;font-family:var(--sans);font-weight:700;font-size:.86rem;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;}
.tabs button.on{background:var(--ink);color:#fff;}
.tab-badge{min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--brand);color:#fff;font-size:.68rem;font-weight:800;display:inline-grid;place-items:center;}
.req-card{background:var(--surface);border:1.5px solid var(--brand);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden;margin-top:14px;}
.req-head{display:flex;align-items:center;gap:8px;padding:12px 16px;background:var(--brand-soft);color:var(--brand-deep);font-weight:800;font-size:.9rem;}
.req-actions{display:flex;gap:8px;flex-shrink:0;}
.btn-danger{background:var(--danger);color:#fff;}
.tabs.tabs-4{grid-template-columns:repeat(4,1fr);}
.tabs.tabs-4 button{font-size:.8rem;gap:4px;padding:0 2px;}
@media (max-width:430px){.tabs.tabs-4 button svg{display:none;}}
.subtabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:-4px 0 14px;}
.subtabs::-webkit-scrollbar{display:none;}
.subtabs button{justify-content:center;border:1px solid var(--line);background:var(--surface);height:40px;padding:0 10px;border-radius:999px;font-family:var(--sans);font-weight:700;font-size:.82rem;color:var(--ink-2);display:flex;align-items:center;gap:6px;cursor:pointer;}
.subtabs button.on{background:var(--brand);border-color:var(--brand);color:#fff;}
.promo{background:#fff;border:1px solid var(--line);border-radius:18px;margin-top:10px;overflow:hidden;}
.promo.on{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset;}
.promo-head{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;cursor:pointer;}
.promo-title{font-weight:800;color:var(--ink);font-size:.95rem;}
.promo-body{padding:0 16px 12px;}
.promo-idea{display:flex;gap:6px;align-items:flex-start;padding:9px 16px;background:var(--surface-2);border-top:1px solid var(--line);font-size:.78rem;color:var(--ink-2);line-height:1.4;}
.promo-idea svg{flex-shrink:0;margin-top:1px;color:#C98A00;}
.switch{flex-shrink:0;width:48px;height:28px;border-radius:999px;border:none;background:#DDD3DA;position:relative;cursor:pointer;transition:background .15s;margin-top:2px;}
.switch span{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .15s;}
.switch.on{background:var(--ok);}
.switch.on span{left:23px;}
.day-chips{display:flex;gap:6px;flex-wrap:wrap;}
.day{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:800;color:var(--ink-2);cursor:pointer;font-family:var(--sans);}
.day.wide{width:auto;padding:0 14px;height:36px;font-size:.82rem;}
.day.on{background:var(--ink);border-color:var(--ink);color:#fff;}
.promo-now{display:flex;gap:8px;align-items:center;padding:9px 12px;border-radius:12px;background:#FFF1CF;color:#6B4700;font-size:.84rem;font-weight:700;}
.bonus-tag{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;background:#FFF1CF;color:#6B4700;font-size:.68rem;font-weight:800;vertical-align:middle;}
.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.month-nav b{font-size:1.05rem;color:var(--ink);}
.report-stats{grid-template-columns:repeat(3,1fr);}
.report-stats .stat{padding:12px;}
.report-stats .stat-num{font-size:1.5rem;}
.delta{display:inline-block;margin-top:4px;font-size:.7rem;font-weight:800;color:var(--muted);}
.delta.up{color:var(--ok);}
.delta.down{color:var(--danger);}
.week-bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;margin-top:6px;}
.wb{display:flex;flex-direction:column;align-items:center;gap:4px;}
.wb-bar{height:90px;width:100%;display:flex;align-items:flex-end;background:var(--surface);border-radius:8px;overflow:hidden;}
.wb-bar span{display:block;width:100%;border-radius:8px 8px 0 0;min-height:3px;}
.wb b{font-size:.8rem;color:var(--ink);}
.wb small{font-size:.7rem;color:var(--muted);font-weight:700;}
.upsell-item{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);}
.upsell-item:last-of-type{border-bottom:none;}
.promo-banner{display:flex;gap:10px;align-items:flex-start;padding:13px 15px;border-radius:16px;background:linear-gradient(135deg,#FFF3D6,#FFE6A8);color:#5A3A00;font-size:.9rem;line-height:1.4;}
.promo-banner svg{flex-shrink:0;margin-top:2px;}
.promo-rules{margin:8px 0 0;padding-left:18px;color:var(--ink-2);font-size:.84rem;line-height:1.55;}
.access-banner{display:flex;gap:10px;align-items:center;margin-top:14px;padding:11px 14px;border-radius:14px;background:#EEF1FB;color:#223E7A;font-size:.86rem;line-height:1.4;}
.access-banner svg{flex-shrink:0;}
.access-banner.warn{background:#FFF1CF;color:#6B4700;}
.acc-pill{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;font-size:.7rem;font-weight:800;background:var(--surface);border:1px solid var(--line);color:var(--muted);}
.acc-pill.trial{background:#EEF1FB;border-color:#D6DDF3;color:#223E7A;}
.acc-pill.paid{background:#E4F5EC;border-color:#BFE6CF;color:var(--ok);}
.acc-pill.warn{background:#FFF1CF;border-color:#F3DC9C;color:#6B4700;}
.acc-pill.off{background:#FDECEA;border-color:#F6C9C3;color:var(--danger);}
.bday{display:grid;grid-template-columns:1fr 1.6fr;gap:8px;}
.bday select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px;}
.req-actions .btn,.sheet .row .btn{min-width:0;}
.input.code.ph-plain::placeholder{letter-spacing:0;font-family:var(--sans);font-size:.95rem;}
.private-note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);font-size:.82rem;line-height:1.45;}
.private-note svg{flex-shrink:0;margin-top:2px;color:var(--ok);}
.new-pin{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:#FFF6DC;color:#5A3A00;font-size:.85rem;font-weight:700;}
.new-pin b{font-size:1.1rem;letter-spacing:.12em;}
.btn-wa{background:#1FA855;color:#fff;}
.share-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;}
.sec-split{height:1px;background:var(--line);margin:20px 0 16px;}
.status-dot{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;font-size:.66rem;font-weight:800;margin-left:6px;background:var(--surface);border:1px solid var(--line);color:var(--muted);vertical-align:middle;}
.status-dot.on{background:#E4F5EC;border-color:#BFE6CF;color:var(--ok);}
.qr-help{background:#fff;border-radius:18px;padding:18px;width:190px;margin:14px auto 6px;box-shadow:0 1px 0 var(--line);}
.qr-help svg{width:100%;height:auto;display:block;}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 12px;box-shadow:var(--shadow);}
.stat-ico{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;margin-bottom:10px;}
.stat-num{font-family:var(--display);font-weight:700;font-size:1.7rem;line-height:1;}
.stat-label{font-size:.74rem;color:var(--muted);font-weight:600;margin-top:4px;}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden;margin-top:14px;}
.item{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;}
.item + .item, .item-open + .item{border-top:1px solid var(--line);}
.item:active{background:var(--surface-2);}
.item-main{flex:1;min-width:0;}
.item-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.item-sub{font-size:.8rem;color:var(--muted);}
.item-prog{text-align:right;min-width:64px;}
.item-prog b{font-size:.9rem;}
.mini{height:5px;border-radius:999px;background:var(--line);margin-top:6px;overflow:hidden;}
.mini span{display:block;height:100%;border-radius:999px;}
.badge-ready{display:inline-block;font-size:.66rem;font-weight:800;color:#6B4700;background:#FFF1CF;padding:3px 7px;border-radius:999px;margin-top:4px;}
.item-open{padding:4px 16px 18px;background:var(--surface-2);border-top:1px solid var(--line);}
.empty{text-align:center;padding:36px 20px;color:var(--muted);}
.empty-ico{width:56px;height:56px;border-radius:18px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;margin:0 auto 12px;}
.kv{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;}
.kv + .kv{border-top:1px solid var(--line);}
.kv .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-weight:700;color:var(--ink);}
.success-ico{width:64px;height:64px;border-radius:22px;background:#E4F5EC;color:var(--ok);display:grid;place-items:center;margin-bottom:16px;}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:13px 18px;border-radius:14px;font-weight:600;font-size:.9rem;display:flex;align-items:center;gap:10px;z-index:50;box-shadow:var(--shadow-lg);max-width:calc(100% - 36px);animation:toast .25s ease both;}
.toast svg{color:var(--accent);flex-shrink:0;}
@keyframes toast{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@media (min-width:600px){.app-shell{padding-top:48px;}h1{font-size:2.5rem;}}
</style>

<script>
/* ---------- Utilidades ---------- */
function jsEsc(str){
  return String(str==null?'':str).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
}
function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}
function slugify(name){
  return String(name||'')
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-')
    .replace(/^-+|-+$/g,'')
    .slice(0,40) || 'negocio';
}
function fmtDate(iso){
  try{ return new Date(iso).toLocaleDateString('es-MX',{day:'numeric',month:'short'}); }catch(e){ return ''; }
}
const COLOR_SWATCHES = ['#E62E6B','#FFB627','#2C56A8','#1E8E5A','#8438B0','#E0472E','#1A1320'];

/* ---------- Conexión con el servidor ---------- */
function normalizePhone(raw){
  let d = String(raw||'').replace(/\D/g,'');
  if(d.length===12 && d.startsWith('52')) d = d.slice(2);
  if(d.length===13 && d.startsWith('521')) d = d.slice(3);
  return d;
}
async function api(method, path, body, pin, extra){
  const headers = { ...(extra||{}) };
  if(body!==undefined) headers['Content-Type'] = 'application/json';
  if(pin) headers['x-business-pin'] = pin;
  if(method==='POST' && path==='/api/businesses' && createForm.adminKey) headers['x-admin-key'] = createForm.adminKey;
  try{
    const res = await fetch(path, { method, headers, body: body!==undefined ? JSON.stringify(body) : undefined });
    let data = null;
    try{ data = await res.json(); }catch(e){}
    return { ok: res.ok, status: res.status, data: data || {} };
  }catch(e){
    return { ok:false, status:0, data:{ error:'No hay conexión con el servidor. Revisa tu internet e intenta de nuevo.' } };
  }
}
function errMsg(r, fallback){ return (r.data && r.data.error) || fallback; }
function enc(s){ return encodeURIComponent(s); }

const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
function customerLink(slug){ return location.origin + '/?n=' + enc(slug); }

/* ---------- Estado global ---------- */
let view = 'home';
let busy = false;
let toastMsg = null;
let toastTimer = null;
let serverConfig = { adminRequired:false, wallet:{ apple:false, google:false } };

let session = { slug:null, pin:null };
let cache = { biz:null, customers:[] };

let createForm = { name:'', mechanic:'sellos', stampsGoal:8, pointsGoal:100, pointsPerVisit:10, rewardDesc:'', color:COLOR_SWATCHES[0], pin:'', adminKey:'', plan:'esencial', trialDays:30 };
const MESES_CORTOS = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function fmtYmd(ymd){ if(!ymd) return ''; const [y,m,d] = ymd.split('-').map(Number); return d+' '+MESES_CORTOS[m-1]+' '+y; }
function isExpired(){ return !!(cache.biz && cache.biz.access && cache.biz.access.expired); }
let createError = '';

let loginForm = { slug:'', pin:'' };
let loginError = '';

let dashboardTab = 'resumen';
let customerSearch = '';
let expandedPhone = null;
let newCustomerOpen = false;
let newCustomerForm = { phone:'', name:'' };
let newCustomerError = '';
let pointsInputs = {};
let confirmRedeemPhone = null;

let configForm = null;
let configSaved = false;

let clienteLookup = { slug:'', phone:'' };
let clienteResult = { status:null, biz:null, customer:null };
let requestForm = { name:'', email:'', favorites:[], favText:'', marketing:false, privacy:false, bday:{day:'',month:''}, ref:'' };
let showPrivacy = false;
let productDraft = '';

function isEmail(e){ return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(e||'').trim()); }
function toggleFavorite(p){
  const i = requestForm.favorites.indexOf(p);
  if(i>=0) requestForm.favorites.splice(i,1);
  else if(requestForm.favorites.length<5) requestForm.favorites.push(p);
  else { showToast('Puedes elegir hasta 5 favoritos.'); return; }
  render();
}
/* ---------- Cumpleaños (día y mes, sin año) ---------- */
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
function bdayValue(b){ return b && b.day && b.month ? String(b.month).padStart(2,'0')+'-'+String(b.day).padStart(2,'0') : ''; }
function bdayText(v){ if(!v) return ''; const [m,d] = v.split('-').map(Number); return d+' de '+MESES[m-1].toLowerCase(); }
function bdayValid(b){
  if(!b || !b.day || !b.month) return false;
  return Number(b.day) <= [31,29,31,30,31,30,31,31,30,31,30,31][Number(b.month)-1];
}
// obj: nombre de la variable global que guarda {day, month}
function bdayPickerHtml(obj, id){
  const b = eval(obj) || {};
  return `<div class="bday" onclick="event.stopPropagation()">
    <select class="input" id="${id}-d" aria-label="Día de tu cumpleaños" onchange="(${obj}=${obj}||{}).day=this.value">
      <option value="">Día</option>${Array.from({length:31},(_,i)=>`<option value="${i+1}" ${String(b.day)===String(i+1)?'selected':''}>${i+1}</option>`).join('')}
    </select>
    <select class="input" id="${id}-m" aria-label="Mes de tu cumpleaños" onchange="(${obj}=${obj}||{}).month=this.value">
      <option value="">Mes</option>${MESES.map((m,i)=>`<option value="${i+1}" ${String(b.month)===String(i+1)?'selected':''}>${m}</option>`).join('')}
    </select>
  </div>`;
}

function privacyHtml(biz){
  const n = escapeHtml(biz.name);
  return `<div class="privacy">
    <p><b>Aviso de privacidad.</b> ${n} es responsable del uso de tus datos personales.</p>
    <p>Usamos tu nombre, teléfono, correo y el día y mes de tu cumpleaños para crear y administrar tu tarjeta de lealtad, dejarte abrirla desde cualquier celular, registrar tus visitas y avisarte de tus premios. Tus productos favoritos nos ayudan a conocerte mejor.</p>
    <p>Solo te enviaremos promociones si marcas la casilla correspondiente, y puedes pedir dejar de recibirlas cuando quieras.</p>
    <p>La plataforma Vuelve guarda estos datos por encargo de ${n}. No se venden ni se comparten con terceros.</p>
    <p>Puedes pedir en cualquier momento acceder, corregir o borrar tus datos directamente en ${n}.</p>
  </div>`;
}
let requestError = '';

function activeCustomers(){ return cache.customers.filter(c => c.status !== 'pending'); }
function pendingCustomers(){ return cache.customers.filter(c => c.status === 'pending'); }

function showToast(msg){
  toastMsg = msg;
  render();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ toastMsg=null; render(); }, 2800);
}

function goHome(){
  view='home'; createError=''; loginError=''; newCustomerError='';
  clienteResult={status:null,biz:null,customer:null};
  history.replaceState(null,'','/');
  render();
}

/* ---------- Acciones: negocio ---------- */
async function submitCrearNegocio(){
  createError='';
  const f = createForm;
  if(!f.name.trim()){ createError='Escribe el nombre de tu negocio.'; render(); return; }
  if(!f.rewardDesc.trim()){ createError='Describe el premio que da tu tarjeta.'; render(); return; }
  if(f.mechanic==='sellos' && !(Number(f.stampsGoal)>=2 && Number(f.stampsGoal)<=30)){ createError='Los sellos para el premio deben ser entre 2 y 30.'; render(); return; }
  if(f.mechanic==='puntos' && !(Number(f.pointsGoal)>=1 && Number(f.pointsPerVisit)>=1)){ createError='Completa los puntos del premio y los puntos por visita.'; render(); return; }
  if(!/^\d{4,8}$/.test(f.pin)){ createError='El PIN debe ser de 4 a 8 dígitos.'; render(); return; }
  if(serverConfig.adminRequired && !f.adminKey.trim()){ createError='Escribe la clave de administrador de P.A.E.'; render(); return; }

  busy = true; render();
  const r = await api('POST','/api/businesses',{
    name:f.name.trim(), mechanic:f.mechanic, stampsGoal:Number(f.stampsGoal), pointsGoal:Number(f.pointsGoal),
    pointsPerVisit:Number(f.pointsPerVisit), rewardDesc:f.rewardDesc.trim(), color:f.color, pin:f.pin, plan:f.plan, trialDays:Number(f.trialDays)||0
  });
  busy = false;
  if(!r.ok){ createError = errMsg(r,'No se pudo crear el negocio.'); render(); return; }
  cache.biz = { ...r.data, pin:f.pin };
  cache.customers = [];
  session = { slug:r.data.slug, pin:f.pin };
  store.set('vuelve_session', JSON.stringify(session));
  createForm = { ...createForm, name:'', rewardDesc:'', pin:'' };
  view = 'negocioExito';
  render();
}

async function loadDashboard(slug, pin){
  const r = await api('POST','/api/businesses/'+enc(slug)+'/login',{ pin });
  if(!r.ok) return r;
  if(r.data.access && r.data.access.expired){
    cache.biz = { ...r.data, pin }; cache.customers = [];
    session = { slug:r.data.slug, pin }; store.set('vuelve_session', JSON.stringify(session));
    return { ok:true };
  }
  const c = await api('GET','/api/businesses/'+enc(slug)+'/customers', undefined, pin);
  if(!c.ok) return c;
  cache.biz = { ...r.data, pin };
  cache.customers = Array.isArray(c.data) ? c.data : [];
  session = { slug:r.data.slug, pin };
  store.set('vuelve_session', JSON.stringify(session));
  return { ok:true };
}

async function submitLogin(){
  loginError='';
  const slug = slugify(loginForm.slug);
  if(!loginForm.slug.trim() || !loginForm.pin){ loginError='Escribe el código de tu negocio y tu PIN.'; render(); return; }
  busy = true; render();
  const r = await loadDashboard(slug, loginForm.pin);
  busy = false;
  if(!r.ok){ loginError = r.status===401 ? 'El código o el PIN no son correctos.' : errMsg(r,'No se pudo entrar.'); render(); return; }
  loginForm = { slug:'', pin:'' };
  dashboardTab='resumen'; expandedPhone=null; customerSearch='';
  view = 'dashboard';
  render();
}

async function refreshCustomers(opts){
  opts = opts || {};
  if(!session.slug || isExpired()) return;
  const c = await api('GET','/api/businesses/'+enc(session.slug)+'/customers', undefined, session.pin);
  if(c.status===402){ handleAuthError(c); return; }
  if(!(c.ok && Array.isArray(c.data))) return;
  const before = JSON.stringify(cache.customers);
  const newPending = c.data.filter(x=>x.status==='pending').length - pendingCustomers().length;
  cache.customers = c.data;
  if(before === JSON.stringify(cache.customers)) return;
  const el = document.activeElement;
  const typing = el && (el.tagName==='INPUT' || el.tagName==='TEXTAREA');
  if(opts.silent && typing) return;
  if(opts.silent && newPending > 0) showToast(newPending===1 ? 'Nueva solicitud de tarjeta' : newPending+' solicitudes nuevas');
  else render();
}

// El panel se actualiza solo cada 15 segundos para mostrar solicitudes nuevas.
setInterval(()=>{
  if(view==='dashboard' && !busy && !isExpired() && document.visibilityState==='visible') refreshCustomers({silent:true});
}, 15000);
document.addEventListener('visibilitychange', ()=>{
  if(view==='dashboard' && !isExpired() && document.visibilityState==='visible') refreshCustomers({silent:true});
});

async function approveRequest(phone){
  if(busy) return;
  rejectConfirmPhone = null;
  busy=true; render();
  const r = await api('POST','/api/businesses/'+enc(session.slug)+'/customers/'+enc(phone)+'/approve',{}, session.pin);
  busy=false;
  if(!r.ok){ if(handleAuthError(r)) return; showToast(errMsg(r,'No se pudo aprobar.')); refreshCustomers(); return; }
  const { bonus:ab, ...approved } = r.data;
  upsertCustomer(approved); delete historyCache[phone];
  dashboardTab='clientes'; expandedPhone=phone; customerSearch='';
  showToast(ab ? 'Tarjeta aprobada con su sello de bienvenida.' : 'Tarjeta aprobada. Ya puedes darle su sello.');
}

let rejectConfirmPhone = null;
async function rejectRequest(phone){
  if(busy) return;
  if(rejectConfirmPhone!==phone){ rejectConfirmPhone = phone; render(); return; }   // primer toque: pide confirmar
  rejectConfirmPhone = null;
  if(scanPhone===phone) scanPhone = null;
  busy=true; render();
  const r = await api('DELETE','/api/businesses/'+enc(session.slug)+'/customers/'+enc(phone), undefined, session.pin);
  busy=false;
  if(!r.ok){ if(handleAuthError(r)) return; showToast(errMsg(r,'No se pudo rechazar.')); refreshCustomers(); return; }
  cache.customers = cache.customers.filter(c=>c.phone!==phone);
  showToast('Solicitud rechazada.');
}

function cerrarSesion(){
  session = {slug:null, pin:null}; cache = {biz:null, customers:[]};
  store.del('vuelve_session');
  goHome();
}

function handleAuthError(r){
  if(r.status===402){ busy=false; scanPhone=null; loadDashboard(session.slug, session.pin).then(()=>{ view='dashboard'; render(); }); return true; }
  if(r.status===401){ showToast('Tu sesión ya no es válida. Entra de nuevo.'); setTimeout(cerrarSesion, 1200); return true; }
  return false;
}

/* ---------- Dueño o personal ---------- */
function isOwner(){ return !!cache.biz && cache.biz.role !== 'staff'; }

/* ---------- Seguridad (solo dueño) ---------- */
let secForm = { newPin:'', newPin2:'', staffPin:'' };
let secError = '';
async function changeOwnerPin(){
  secError='';
  const a = secForm.newPin, b = secForm.newPin2;
  if(!/^\d{4,8}$/.test(a)){ secError='El PIN nuevo debe ser de 4 a 8 dígitos.'; render(); return; }
  if(a!==b){ secError='Los dos PIN no coinciden.'; render(); return; }
  busy=true; render();
  const r = await api('PUT','/api/businesses/'+enc(session.slug)+'/pin',{ newPin:a }, session.pin);
  busy=false;
  if(!r.ok){ if(handleAuthError(r)) return; secError = errMsg(r,'No se pudo cambiar el PIN.'); render(); return; }

function loadJsQR(){
  if(window.jsQR) return Promise.resolve();
  return new Promise((ok, fail)=>{
    const sc = document.createElement('script');
    sc.src = '/jsqr.min.js'; sc.onload = ok; sc.onerror = fail;
    document.head.appendChild(sc);
  });
}

async function openScanner(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    showToast('Este navegador no permite usar la cámara. Busca al cliente por teléfono.'); return;
  }
  closeScanner();
  const box = document.createElement('div');
  box.id = 'scanner';
  box.innerHTML = '<video playsinline muted></video><div class="frame"></div><div class="hint">Apunta al código QR de la tarjeta del cliente</div><button class="close" onclick="closeScanner()">Cancelar</button>';
  document.body.appendChild(box);
  try{
    await loadJsQR();
    scanStream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' }, audio:false });
  }catch(e){
    closeScanner();
    showToast('No se pudo abrir la cámara. Revisa el permiso de cámara del navegador.');
    return;
  }
  if(!document.getElementById('scanner')){ closeScanner(); return; }
  const video = box.querySelector('video');
  video.srcObject = scanStream;
  await video.play().catch(()=>{});
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently:true });
  const tick = ()=>{
    if(!scanStream) return;
    if(video.readyState >= 2 && video.videoWidth){
      const w = 480, h = Math.round(video.videoHeight * (w / video.videoWidth));
      canvas.width = w; canvas.height = h;
      ctx.drawImage(video, 0, 0, w, h);
      const code = window.jsQR(ctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts:'dontInvert' });
      if(code && code.data){ handleScan(code.data); return; }
    }
    scanTimer = setTimeout(tick, 120);
  };
  tick();
}

function closeScanner(){
  clearTimeout(scanTimer);
  if(scanStream){ scanStream.getTracks().forEach(t=>t.stop()); scanStream = null; }
  const box = document.getElementById('scanner');
  if(box) box.remove();
}

function handleScan(text){
  closeScanner();
  try{ navigator.vibrate && navigator.vibrate(60); }catch(e){}
  const m = String(text).trim().match(/^([a-z0-9-]+):(\d{10})$/);
  if(!m){ showToast('Ese código no es una tarjeta Vuelve.'); return; }
  if(m[1] !== session.slug){ showToast('Esa tarjeta es de otro negocio.'); return; }
  const c = cache.customers.find(x=>x.phone===m[2]);
  if(!c){ showToast('No encontramos esa tarjeta. Revisa si la solicitud sigue pendiente.'); refreshCustomers(); return; }
  openSheet(c.phone);
}

// Reduce la imagen a 256 px (suficiente para la tarjeta) antes de subirla
function prepareLogo(file){
  return new Promise((ok, fail)=>{
    if(!file || !/^image\//.test(file.type)){ fail(new Error('Elige una imagen.')); return; }
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      const max = 256, k = Math.min(1, max/Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width*k)); c.height = Math.max(1, Math.round(img.height*k));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      let data = c.toDataURL('image/png');
      if(data.length*0.75 > 190*1024) data = c.toDataURL('image/webp', 0.9);
      if(!/^data:image\/(png|webp)/.test(data) || data.length*0.75 > 190*1024) data = c.toDataURL('image/jpeg', 0.88);
      ok(data);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); fail(new Error('No se pudo leer la imagen.')); };
    img.src = url;
  });
}

  memCards[slug] = { phone, token };
  store.set('vuelve_card_'+slug, JSON.stringify({ phone, token }));
  return !!store.get('vuelve_card_'+slug);
}
function delCard(slug){ delete memCards[slug]; store.del('vuelve_card_'+slug); }

async function inviteFriend(){

}

let unlockForm = { day:'', month:'' };
let unlockError = '';
let unlockNoBday = false;
async function unlockCard(){
  unlockError='';
  const { biz, customer } = clienteResult;
  if(!unlockForm.day || !unlockForm.month){ unlockError='Elige el día y el mes de tu cumpleaños.'; render(); return; }
  busy=true; render();
  const r = await api('POST','/api/businesses/'+enc(biz.slug)+'/customers/'+enc(customer.phone)+'/unlock',{ birthday:bdayValue(unlockForm) });
  busy=false;
  if(!r.ok){
    if(r.data.code==='no_birthday') unlockNoBday = true;
    else unlockError = errMsg(r,'No se pudo abrir tu tarjeta.');
    render(); return;
  }
  setCard(biz.slug, customer.phone, r.data.cardToken);
  unlockForm = { day:'', month:'' };
  clienteResult = { status: r.data.status==='pending' ? 'pending' : 'found', biz, customer:r.data, token:r.data.cardToken };
  render();
}

let myBday = { day:'', month:'' };
async function saveMyBirthday(){

async function buscarTarjetaCliente(){
  const slug = slugify(clienteLookup.slug);
  const phone = normalizePhone(clienteLookup.phone);
  if(!clienteLookup.slug.trim()){ showToast('Escribe el código del negocio.'); return; }
  if(phone.length<10){ showToast('Escribe tu teléfono de 10 dígitos.'); return; }
  busy=true; render();
  const b = await api('GET','/api/businesses/'+enc(slug));
  if(!b.ok){
    busy=false;
    if(b.status===404){ clienteResult = {status:'no_biz', biz:null, customer:null}; view='clienteTarjeta'; render(); }
    else showToast(errMsg(b,'No se pudo buscar tu tarjeta.'));
    return;
  }
  unlockError=''; unlockNoBday=false; unlockForm={ day:'', month:'' };
  const mine = getCard(slug);
  const token = mine && mine.phone===phone ? mine.token : null;
  const c = await api('GET','/api/businesses/'+enc(slug)+'/customers/'+enc(phone), undefined, null, token ? { 'x-card-token': token } : undefined);
  busy=false;
  if(!c.ok && c.status!==404){ showToast(errMsg(c,'No se pudo buscar tu tarjeta.')); return; }
  let status;
  if(!c.ok) status = 'no_card';
  else if(c.data.locked){ status = 'locked'; if(token) delCard(slug); }
  else status = c.data.status==='pending' ? 'pending' : 'found';
  clienteResult = { status, biz:b.data, customer: c.ok ? { phone, ...c.data } : null, token: status==='locked' ? null : token };
  requestError='';
  store.set('vuelve_tel_'+slug, phone);
  view = 'clienteTarjeta';
  render();
}

async function solicitarTarjeta(){
  requestError='';
  const biz = clienteResult.biz;
  const phone = normalizePhone(clienteLookup.phone);
  const f = requestForm;
  if(!f.name.trim()){ requestError='Escribe tu nombre para que el negocio te reconozca.'; render(); return; }
  if(!isEmail(f.email)){ requestError='Escribe un correo válido.'; render(); return; }
  if(!f.bday.day || !f.bday.month){ requestError='Elige el día y el mes de tu cumpleaños.'; render(); return; }
  if(!bdayValid(f.bday)){ requestError='Esa fecha no existe. Revisa el día y el mes.'; render(); return; }
  if(!f.privacy){ requestError='Para crear tu tarjeta necesitas aceptar el aviso de privacidad.'; render(); return; }
  const favorites = biz.plan!=='premium' ? [] : ((biz.products||[]).length ? f.favorites : (f.favText.trim() ? [f.favText.trim()] : []));
  busy=true; render();
  const r = await api('POST','/api/businesses/'+enc(biz.slug)+'/customers/request',{
    phone, name:f.name.trim(), email:f.email.trim(), favorites, marketingOptIn:f.marketing, privacyAccepted:true, birthday:bdayValue(f.bday),
    referredBy: normalizePhone(f.ref||'') || undefined
  });
  busy=false;
  if(r.status===409 && r.data.code==='exists'){
    clienteResult = { status:'locked', biz, customer:{ phone, ...r.data }, token:null };
    render(); return;
  }
  if(!r.ok){ requestError = errMsg(r,'No se pudo enviar tu solicitud.'); render(); return; }
  store.set('vuelve_tel_'+biz.slug, phone);
  setCard(biz.slug, phone, r.data.cardToken);
  clienteResult = { status: r.data.status==='pending' ? 'pending' : 'found', biz, customer:r.data, token:r.data.cardToken };
  requestForm = { name:'', email:'', favorites:[], favText:'', marketing:false, privacy:false, bday:{day:'',month:''}, ref:'' };
  showPrivacy = false;
  render();
}

async function addToWallet(kind){
  const { biz, customer, token } = clienteResult;
  if(!biz || !customer || !token) return;
  if(!serverConfig.wallet[kind]){ showToast('Muy pronto podrás guardarla en tu Wallet.'); return; }
  if(kind==='apple'){
    location.href = '/api/businesses/'+enc(biz.slug)+'/wallet/apple/'+enc(customer.phone)+'?t='+enc(token);
    return;
  }
  const r = await api('GET','/api/businesses/'+enc(biz.slug)+'/wallet/google/'+enc(customer.phone)+'?t='+enc(token));
  if(r.ok && r.data.url) location.href = r.data.url;
  else showToast(errMsg(r,'No se pudo abrir Google Wallet.'));
}

/* ---------- Arranque ---------- */
async function boot(){
  const cfg = await api('GET','/api/config');
  if(cfg.ok) serverConfig = cfg.data;

  const params = new URLSearchParams(location.search);
  const n = params.get('n');
  if(n){
    const slug = slugify(n);
    clienteLookup.slug = slug;
    const ref = normalizePhone(params.get('ref')||'');
    if(ref.length===10) requestForm.ref = ref;     // viene de la invitación de un amigo
    // Liga personal del cliente: /?n=negocio&c=telefono&t=clave
    const lc = normalizePhone(params.get('c')||''), lt = params.get('t');
    if(lc.length===10 && lt){
      const kept = setCard(slug, lc, lt);
      if(kept) history.replaceState(null,'','/?n='+enc(slug));   // quita la clave de la barra de direcciones
    }
    const card = getCard(slug);
    const saved = card ? card.phone : store.get('vuelve_tel_'+slug);
    if(saved){ clienteLookup.phone = saved; await buscarTarjetaCliente(); return; }
    view = 'clienteBuscar'; render(); return;
  }

  let saved = null;
  try{ saved = JSON.parse(store.get('vuelve_session')||'null'); }catch(e){}
  if(saved && saved.slug && saved.pin){
    busy = true; render();
    const r = await loadDashboard(saved.slug, saved.pin);
    busy = false;
    if(r.ok){ dashboardTab='resumen'; view='dashboard'; render(); return; }
    store.del('vuelve_session');
  }
  render();
}

/* ---------- Color ---------- */
function hexToRgb(hex){
  const h = String(hex||'#E62E6B').replace('#','');
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
function textOn(hex){
  const [r,g,b] = hexToRgb(hex).map(v=>{ v/=255; return v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055,2.4); });
  const lum = 0.2126*r + 0.7152*g + 0.0722*b;
  return lum > 0.45 ? '#1A1320' : '#FFFFFF';
}
function shade(hex, amt){
  const [r,g,b] = hexToRgb(hex);
  const f = v => Math.max(0, Math.min(255, Math.round(v + (amt/100)*(amt<0 ? v : 255-v))));
  return '#' + [f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function tint(hex){ const [r,g,b]=hexToRgb(hex); return `rgba(${r},${g},${b},0.12)`; }
function initialOf(name){ return (String(name||'?').trim()[0]||'?').toUpperCase(); }
function goalOf(biz){ return biz.mechanic==='sellos' ? Number(biz.stampsGoal) : Number(biz.pointsGoal); }

function stampSvg(id, size){
  const icon = STAMP_ICONS[id] || STAMP_ICONS.check;
  size = size || 20;
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icon.svg}</svg>`;
}

// Patrón de fondo con el ícono del sello, muy tenue, en el color del texto de la tarjeta
function patternUrl(id, onColor){
  const icon = STAMP_ICONS[id] || STAMP_ICONS.check;
  const stroke = onColor === '#FFFFFF' ? 'rgba(255,255,255,0.13)' : 'rgba(26,19,32,0.10)';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="38" height="38" viewBox="-7 -7 38 38" fill="none" stroke="${stroke}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${icon.svg}</svg>`;
  // Comillas simples: este valor va dentro de style="..." y unas comillas dobles lo cortarían.
  return `url('data:image/svg+xml,${encodeURIComponent(svg).replace(/'/g,'%27')}')`;
}

function passHtml(biz, customer, opts){
  opts = opts || {};
  const goal = Math.max(1, goalOf(biz) || 1);
  const progress = customer ? Number(customer.progress)||0 : 0;
  const ready = customer && progress >= goal;
  const on = textOn(biz.color);
  const cardStyle = biz.cardStyle || 'gradient';
  const stampIcon = biz.stampIcon || 'check';
  const style = `--c:${biz.color};--c2:${shade(biz.color,-28)};--on:${on}` + (cardStyle==='pattern' ? `;--pat:${patternUrl(stampIcon, on)}` : '');
  let body;
  if(biz.mechanic==='sellos'){
    const shown = Math.min(goal, 30);
    let s='';
    for(let i=0;i<shown;i++){
      const filled = i < progress;
      const last = i === shown-1;
      s += `<span class="stamp ${filled?'on':''} ${!filled&&last?'gift':''}">${filled?stampSvg(stampIcon):(last?ic('gift',16):'')}</span>`;
    }
    body = `<div class="stamps">${s}</div>`;
  }else{
    const pct = Math.max(0, Math.min(100, Math.round(progress/goal*100)));
    body = `<div class="pts"><span class="pts-num">${progress}</span><span class="pts-of">de ${goal} puntos</span></div><div class="pbar"><span style="width:${pct}%"></span></div>`;
  }
  const who = customer ? (customer.name || customer.phone || 'Cliente') : 'Tus clientes';
  const qr = (opts.qr && customer && customer.phone)
    ? `<div class="pass-qr"><div class="qr" data-qr="${escapeHtml(biz.slug+':'+customer.phone)}"></div><small>Muéstralo en caja · ${escapeHtml(customer.phone)}</small></div>` : '';
  return `
  <div class="pass ${opts.tilt?'pass-tilt':''} ${cardStyle}" style="${style}">
    <div class="pass-top">
      <div class="pass-logo ${biz.logoUrl?'has-img':''}">${biz.logoUrl ? `<img src="${escapeHtml(biz.logoUrl)}" alt="">` : escapeHtml(initialOf(biz.name))}</div>
      <div class="pass-id"><div class="pass-name">${escapeHtml(biz.name)}</div><div class="pass-kind">${escapeHtml(biz.cardTitle || 'Tarjeta de lealtad')}</div></div>
      ${ready ? `<span class="pass-ready">Premio listo</span>` : ''}
    </div>
    <div class="pass-body">${body}</div>
    <div class="pass-meta">
      <div><span class="k">Premio</span><span class="v">${escapeHtml(biz.rewardDesc)}</span></div>
      <div><span class="k">${biz.mechanic==='sellos'?'Sellos':'Nivel'}</span><span class="v">${biz.mechanic==='sellos' ? Math.min(progress,goal)+'/'+goal : escapeHtml(who)}</span></div>
    </div>
    ${qr}
  </div>`;
}

function hydrateQR(){
  if(!document.querySelectorAll) return;
  document.querySelectorAll('[data-qr]').forEach(el=>{
    try{
      if(typeof qrcode==='function'){
        const q = qrcode(0,'M');
        q.addData(el.getAttribute('data-qr'));
        q.make();
        el.innerHTML = q.createSvgTag({cellSize:4, margin:0, scalable:true});
      }else{
        el.innerHTML = ic('card',40);
      }
    }catch(e){ el.innerHTML = ic('card',40); }
  });
}

function copyText(t, label){
  label = label || 'Código copiado';
  try{
    navigator.clipboard.writeText(t).then(()=>showToast(label)).catch(()=>showToast(t));
  }catch(e){ showToast(t); }
}

/* ---------- Administración P.A.E. (clave de administrador, no se guarda en el celular) ---------- */
let adminKey = '';
let adminData = null;
let adminError = '';

async function adminLogin(){
  adminError='';
  if(!adminKey.trim()){ adminError='Escribe tu clave de administrador.'; render(); return; }
  busy=true; render();
  const r = await adminFetch('/api/admin/summary');
  busy=false;
  if(!r.ok){ adminError = r.error; render(); return; }
  adminData = r.data;
  render();
}

async function adminFetch(path){
  try{
    const res = await fetch(path, { headers:{ 'x-admin-key': adminKey.trim() } });
    if(!res.ok){ let e={}; try{ e=await res.json(); }catch(x){} return { ok:false, error:e.error||'No se pudo conectar.' }; }
    return { ok:true, data: await res.json() };
  }catch(e){ return { ok:false, error:'No hay conexión con el servidor.' }; }
}

async function adminBackup(){
  busy=true; render();
  try{
    const res = await fetch('/api/admin/backup', { headers:{ 'x-admin-key': adminKey.trim() } });
    if(!res.ok){ busy=false; showToast('No se pudo generar el respaldo.'); return; }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'vuelve-respaldo-'+new Date().toISOString().slice(0,10)+'.db';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    busy=false;
    showToast('Respaldo descargado. Guárdalo en Google Drive.');
  }catch(e){ busy=false; showToast('No se pudo generar el respaldo.'); }
}

async function adminSetPlan(slug, plan){
  if(plan==='esencial' && !confirm('¿Pasar este negocio a Esencial? Su diseño se guarda y regresa si vuelve a Premium.')) return;
  busy=true; render();
  try{
    const res = await fetch('/api/admin/businesses/'+enc(slug)+'/plan', { method:'PUT', headers:{ 'x-admin-key': adminKey.trim(), 'Content-Type':'application/json' }, body: JSON.stringify({ plan }) });
    busy=false;
    if(!res.ok){ showToast('No se pudo cambiar el plan.'); render(); return; }
    const b = (adminData.businesses||[]).find(x=>x.slug===slug);
    if(b) b.plan = plan;
    showToast(plan==='premium' ? 'Negocio en Premium.' : 'Negocio en Esencial.');
  }catch(e){ busy=false; showToast('No hay conexión con el servidor.'); }
}

async function adminAccess(slug, body, okMsg){
  busy=true; render();
  try{
    const res = await fetch('/api/admin/businesses/'+enc(slug)+'/access', { method:'PUT', headers:{ 'x-admin-key': adminKey.trim(), 'Content-Type':'application/json' }, body: JSON.stringify(body) });
    const data = await res.json().catch(()=>({}));
    busy=false;
    if(!res.ok){ showToast(data.error || 'No se pudo guardar.'); return; }
    const b = (adminData.businesses||[]).find(x=>x.slug===slug);
    if(b) b.access = data.access;
    accessEdit = null;
    showToast(okMsg);
  }catch(e){ busy=false; showToast('No hay conexión con el servidor.'); }
}

// "Un fermento gratis" -> "un fermento gratis" para usarlo a media frase (respeta siglas como "2x1" o "CACHAI")
function inSentence(t){
  t = String(t||'');
  return /^[A-ZÁÉÍÓÚÑ][a-záéíóúñ]/.test(t) ? t.charAt(0).toLowerCase() + t.slice(1) : t;
}

function qrSvg(text){
  try{ const q = qrcode(0,'M'); q.addData(text); q.make(); return q.createSvgTag({cellSize:4, margin:0, scalable:true}); }
  catch(e){ return ''; }
}

// Dibuja el QR en un lienzo grande (sirve para descargarlo y para el cartel)
function qrCanvas(text, size, dark){
  const q = qrcode(0,'M'); q.addData(text); q.make();
  const n = q.getModuleCount(), margin = 4, cell = Math.floor(size/(n+margin*2));
  const c = document.createElement('canvas'); c.width = c.height = cell*(n+margin*2);
  const g = c.getContext('2d'); g.fillStyle = '#FFFFFF'; g.fillRect(0,0,c.width,c.height);
  g.fillStyle = dark || '#1A1320';
  for(let r=0;r<n;r++) for(let k=0;k<n;k++) if(q.isDark(r,k)) g.fillRect((k+margin)*cell,(r+margin)*cell,cell,cell);
  return c;
}

function downloadCanvas(canvas, filename){
  canvas.toBlob(blob=>{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  }, 'image/png');
}

function downloadQR(){
  downloadCanvas(qrCanvas(customerLink(cache.biz.slug), 1200), 'qr-'+cache.biz.slug+'.png');

function topFavoritesHtml(){

  cache.customers.forEach(c => (c.favorites||[]).forEach(f => { counts[f] = (counts[f]||0) + 1; }));

  const q = customerSearch.trim();

  const rows = list.map(c => {

          <button class="btn btn-primary" style="flex:1" ${busy?'disabled':''} onclick="event.stopPropagation();addProgress('${jsEsc(c.phone)}', Number(pointsInputs['${jsEsc(c.phone)}'] || ${biz.pointsPerVisit}))">${ic('plus')} Sumar puntos</button></div>`;
      }

    ${newCustomerOpen ? `
      <div class="card mt-12">
        <div class="card-title">${ic('user',18)} Nuevo cliente</div>
        <div class="field"><label for="n-phone">Teléfono</label><input id="n-phone" class="input" type="tel" inputmode="tel" value="${escapeHtml(newCustomerForm.phone)}" oninput="newCustomerForm.phone=this.value" placeholder="222 123 4567"></div>

        <div class="field"><label>Cumpleaños <span class="muted">(recomendado)</span></label>${bdayPickerHtml('newCustomerForm.bday','n-bday')}<p class="hint">Con su teléfono y cumpleaños podrá abrir su tarjeta desde cualquier celular.</p></div>
        <div class="field"><label for="n-email">Correo <span class="muted">(opcional)</span></label><input id="n-email" class="input" type="email" autocapitalize="none" value="${escapeHtml(newCustomerForm.email||'')}" oninput="newCustomerForm.email=this.value" placeholder="ana@ejemplo.com"></div>
        <label class="check"><input type="checkbox" ${newCustomerForm.marketing?'checked':''} onchange="newCustomerForm.marketing=this.checked"><span>El cliente acepta recibir promociones por WhatsApp o correo.</span></label>
        ${errorHtml(newCustomerError)}

  `;
}

/* =================== Crecer (Premium): promociones, te extrañamos, cumpleaños y reporte =================== */
let crecerSub = 'promos';
let growth = { promos:null, inactive:null, inactiveDays:30, birthdays:null, report:null, month:null };
let promoForm = null;
let contacted = {};   // a quién ya se le abrió WhatsApp en esta sesión

function openCrecer(){ dashboardTab='crecer'; render(); loadCrecer(); }
async function gget(path){
  const r = await api('GET','/api/businesses/'+enc(session.slug)+'/growth'+path, undefined, session.pin);
  if(!r.ok){ if(handleAuthError(r)) return null; showToast(errMsg(r,'No se pudo cargar.')); return null; }
  return r.data;
}
async function loadCrecer(){
  if(!isPremiumBiz()) return;
  if(crecerSub==='promos' && !growth.promos){ const d = await gget('/promos'); if(d){ growth.promos=d; promoForm=JSON.parse(JSON.stringify(d)); render(); } }
  if(crecerSub==='inactive' && !growth.inactive){ const d = await gget('/inactive?days='+growth.inactiveDays); if(d){ growth.inactive=d; render(); } }
  if(crecerSub==='birthdays' && !growth.birthdays){ const d = await gget('/birthdays'); if(d){ growth.birthdays=d; render(); } }
  if(crecerSub==='report' && !growth.report){ const d = await gget('/report'+(growth.month?'?month='+growth.month:'')); if(d){ growth.report=d; growth.month=d.current.month; render(); } }
}
function setCrecerSub(k){ crecerSub=k; render(); loadCrecer(); }
function firstName(n){ return String(n||'').trim().split(/\s+/)[0] || ''; }
function waOpen(phone, text){ contacted[phone]=true; window.open('https://wa.me/52'+phone+'?text='+encodeURIComponent(text), '_blank'); render(); }
function unitWord(n){ return cache.biz.mechanic==='sellos' ? (n===1?'sello':'sellos') : (n===1?'punto':'puntos'); }

// ----- Promociones -----
const DIAS = ['D','L','M','M','J','V','S'];
const DIAS_LARGO = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const HORAS = Array.from({length:17},(_,i)=>String(i+7).padStart(2,'0')+':00');   // 07:00 a 23:00
function togglePromo(k){ promoForm[k].on = !promoForm[k].on; if(k==='days' && promoForm.days.on && !promoForm.days.days.length) promoForm.days.days=[2]; render(); }
function toggleDay(d){ const a=promoForm.days.days; const i=a.indexOf(d); if(i>=0) a.splice(i,1); else a.push(d); a.sort(); render(); }
function recommendedPromos(){
  ['welcome','birthday','comeback','referral'].forEach(k=>promoForm[k].on=true);
  render(); showToast('Listo: bienvenida, cumpleaños, bono de regreso e invita a un amigo. Toca Guardar.');
}
async function savePromos(){
  if(promoForm.season.on && !(promoForm.season.from && promoForm.season.to && promoForm.season.from<=promoForm.season.to)){ showToast('Elige las fechas de tu temporada doble.'); return; }
  if(promoForm.happyHour.on && !(promoForm.happyHour.from<promoForm.happyHour.to)){ showToast('La hora feliz debe terminar después de empezar.'); return; }
  busy=true; render();
  const r = await api('PUT','/api/businesses/'+enc(session.slug)+'/growth/promos', promoForm, session.pin);
  busy=false;
  if(!r.ok){ if(handleAuthError(r)) return; showToast(errMsg(r,'No se pudieron guardar.')); return; }
  growth.promos = r.data.promos; promoForm = JSON.parse(JSON.stringify(r.data.promos));
  cache.biz.promos = r.data.summary;
  showToast('Promociones guardadas. Tus clientes ya las ven en su tarjeta.');
}
function promoCard(k, title, desc, idea, extra){
  const on = promoForm[k].on;
  return `<div class="promo ${on?'on':''}">
    <div class="promo-head" onclick="togglePromo('${k}')">
      <div style="flex:1;min-width:0"><div class="promo-title">${title}</div><div class="muted small" style="line-height:1.45;margin-top:2px">${desc}</div></div>
      <button class="switch ${on?'on':''}" role="switch" aria-checked="${on}" aria-label="${escapeHtml(title)}" onclick="event.stopPropagation();togglePromo('${k}')"><span></span></button>
    </div>
    ${on && extra ? `<div class="promo-body">${extra}</div>` : ''}
    ${idea ? `<div class="promo-idea">${ic('bolt',14)} ${idea}</div>` : ''}
  </div>`;
}

    ${promoCard('birthday','Semana de cumpleaños', `${u.charAt(0).toUpperCase()+u.slice(1)} doble del 3 días antes al 3 días después de su cumpleaños.`, 'Tus clientes se sienten consentidos y te visitan en su semana.')}
    ${promoCard('comeback','Bono de regreso', `Si un cliente regresa después de varios días sin venir, su ${u} vale doble.`, 'Combínalo con "Te extrañamos": mándale mensaje y dale una razón para volver.',

function missMsg(c){
  const biz = cache.biz, goal = goalOf(biz), left = Math.max(0, goal - c.progress);

  let m = `Hola${n?' '+n:''}, ¡te extrañamos en ${biz.name}! `;
  m += c.progress>0 ? `Llevas ${c.progress} de ${goal} ${unitWord(goal)}${left>0?` y te ${left===1?'falta':'faltan'} ${left} para tu premio: ${inSentence(biz.rewardDesc)}`:`: ¡ya tienes tu premio (${inSentence(biz.rewardDesc)}) esperándote!`}. ` : `Tu tarjeta te está esperando para tu primer ${unitWord(1)}. `;

async function giftStamp(phone){
  if(busy) return;
  busy=true; render();
  const amount = cache.biz.mechanic==='sellos' ? 1 : (cache.biz.pointsPerVisit||1);
  const r = await api('POST','/api/businesses/'+enc(session.slug)+'/customers/'+enc(phone)+'/progress',{ amount, gift:true }, session.pin);
  busy=false;
  if(!r.ok){ if(handleAuthError(r)) return; showToast(errMsg(r,'No se pudo regalar.')); return; }
  const { bonus, ...cust } = r.data; upsertCustomer(cust); delete historyCache[phone];
  const b = growth.birthdays && growth.birthdays.customers.find(x=>x.phone===phone); if(b){ b.progress = cust.progress; b.gifted = true; }
  showToast('Le regalaste '+amount+' '+unitWord(amount)+'.');
}

const MESES_LARGOS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function monthName(m){ const [y,mo]=m.split('-').map(Number); return MESES_LARGOS[mo-1].charAt(0).toUpperCase()+MESES_LARGOS[mo-1].slice(1)+' '+y; }
function shiftMonth(delta){
  const [y,m] = growth.month.split('-').map(Number); const d = new Date(Date.UTC(y, m-1+delta, 1));
  growth.month = d.toISOString().slice(0,7); growth.report=null; render(); loadCrecer();
}
function delta(cur, prev){
  const d = cur - prev; if(!prev && !cur) return '';
  if(d===0) return `<span class="delta">= igual</span>`;
  return `<span class="delta ${d>0?'up':'down'}">${d>0?'▲ +':'▼ '}${d}</span>`;
}
function reportText(r){
  const c = r.current, u = r.mechanic==='sellos'?'Sellos':'Puntos';
  const rate = c.activeCustomers ? Math.round(c.returningCustomers/c.activeCustomers*100) : 0;
  return [`Resumen de ${monthName(c.month)} · ${cache.biz.name}`,
    `• Clientes nuevos: ${c.newCustomers}`, `• Visitas: ${c.visits}`, `• Clientes que regresaron: ${c.returningCustomers} (${rate}%)`,
    `• ${u} dados: ${c.given}${c.bonusGiven?` (${c.bonusGiven} de promociones)`:''}`, `• Premios canjeados: ${c.redemptions}`,
    ...(c.topProducts.length?[`• Lo más vendido: ${c.topProducts.slice(0,3).map(p=>p.name).join(', ')}`]:[]),
    '', 'Tarjeta de lealtad Vuelve · P.A.E.'].join('\n');
}
function reportHtml(){
  const r = growth.report;

  const c = r.current, p = r.previous, u = r.mechanic==='sellos'?'Sellos':'Puntos';

  const tile = (label, v, pv, color) => `<div class="stat"><div class="stat-num">${v}</div><div class="stat-label">${label}</div>${delta(v,pv)}</div>`;

  return `
    <div class="month-nav">
      <button class="icon-btn" aria-label="Mes anterior" onclick="shiftMonth(-1)">${ic('left',18)}</button>
      <b>${monthName(c.month)}</b>
      <button class="icon-btn" aria-label="Mes siguiente" ${isCurrent?'disabled style="opacity:.35"':''} onclick="shiftMonth(1)">${ic('right',18)}</button>
    </div>
    <div class="stats report-stats">
      ${tile('Clientes nuevos', c.newCustomers, p.newCustomers)}
      ${tile('Visitas', c.visits, p.visits)}
      ${tile('Regresaron', c.returningCustomers, p.returningCustomers)}
      ${tile(u+' dados', c.given, p.given)}
      ${tile('Premios', c.redemptions, p.redemptions)}
      ${tile('Clientes activos', c.activeCustomers, p.activeCustomers)}
    </div>
    <div class="card mt-12">
      <div class="kv"><span class="small" style="font-weight:700">Tasa de regreso</span><b style="font-size:1.1rem;color:${rate>=50?'var(--ok)':'var(--ink)'}">${rate}%</b></div>
      <p class="muted small" style="margin-top:6px">De los clientes que vinieron este mes, ${rate}% ya te había visitado antes.${c.bonusGiven?` Tus promociones regalaron ${c.bonusGiven} ${u.toLowerCase()}.`:''}</p>
    </div>
    ${c.topProducts.length ? `<div class="card"><div class="card-title">${ic('heart',18)} Lo más vendido</div>${c.topProducts.map((x,i)=>`<div class="fav-rank"><span class="avatar sm" style="width:28px;height:28px;border-radius:9px;font-size:.78rem;background:var(--brand-soft);color:var(--brand-deep)">${i+1}</span><b>${escapeHtml(x.name)}</b><span class="muted small">${x.n} ${x.n===1?'vez':'veces'}</span></div>`).join('')}</div>` : ''}
    ${c.topCustomers.length ? `<div class="card"><div class="card-title">${ic('users',18)} Tus clientes más fieles</div>${c.topCustomers.map((x,i)=>`<div class="fav-rank"><span class="avatar sm" style="width:28px;height:28px;border-radius:9px;font-size:.78rem;background:#FFF1CF;color:#8A5B00">${i+1}</span><b>${escapeHtml(x.name)}</b><span class="muted small">${x.n} ${x.n===1?'visita':'visitas'}</span></div>`).join('')}</div>` : ''}
